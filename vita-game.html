var audioCtx = null;
function initAudio() { if (audioCtx) return; try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
function playTone(freq, dur, type, vol) {
    if (!audioCtx) return; type = type || 'square'; vol = vol || 0.1;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
}

// Particles
var particles = [];
function spawnParticles(x, y, count, color, spread) {
    for (var i = 0; i < count; i++) {
        var a = Math.random() * Math.PI * 2, s = (Math.random() * 3 + 1) * (spread || 1);
        particles.push({x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-2, life:1, decay:0.01+Math.random()*0.03, color:color, size:2+Math.random()*4});
    }
}
function updateParticles() {
    for (var i = particles.length-1; i >= 0; i--) {
        var p = particles[i]; p.x += p.vx; p.vy += 0.1; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}
function drawParticles(cx, cy) {
    for (var i = 0; i < particles.length; i++) {
        var p = particles[i]; ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.fillRect(p.x-cx-p.size/2, p.y-cy-p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

// Player
var player = {x:100,y:400,w:30,h:44,vx:0,vy:0,onGround:false,health:3,maxHealth:3,facing:1,animFrame:0,animTimer:0,sprinting:false,invincible:0,speedBoost:0,doubleScore:0,iceBox:0};
var camera = {x:0,y:0,targetX:0,targetY:0};
var levelTimer=0,levelScore=0,levelItems=0,levelItemsCollected=0;
var collectibles=[],obstacles=[],powerups=[],powerupIcons=[],jumpPads=[],truckReached=false,levelCompleteTimer=0;
var GRAVITY=0.55,FRICTION=0.82,JUMP_FORCE=-11.5,MAX_FALL=14;

function resetPlayer() {
    player.x=60;player.y=400;player.vx=0;player.vy=0;player.onGround=false;player.health=3;
    player.facing=1;player.animFrame=0;player.sprinting=false;player.invincible=0;
    player.speedBoost=0;player.doubleScore=0;player.iceBox=0;
}
function getSpeed() { var s=4.5; if(player.sprinting)s=7; if(player.speedBoost>0)s*=1.6; return s; }
function rectsOverlap(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }

function platformCollision() {
    var speed=getSpeed();
    if(keys['ArrowLeft']||keys['KeyA'])player.vx=-speed;else if(keys['ArrowRight']||keys['KeyD'])player.vx=speed;else player.vx*=FRICTION;
    if(Math.abs(player.vx)<0.1)player.vx=0;
    player.sprinting=(keys['ShiftLeft']||keys['ShiftRight'])&&Math.abs(player.vx)>1;
    player.vy+=GRAVITY;if(player.vy>MAX_FALL)player.vy=MAX_FALL;
    player.x+=player.vx;player.y+=player.vy;
    var pb={x:player.x,y:player.y,w:player.w,h:player.h},lvl=LEVELS[currentLevel],plats=lvl.platforms;

    // Mud slowdown
    var inMud=false;
    for(var i=0;i<obstacles.length;i++){var o=obstacles[i];if(o.s==='mud'&&o.active){var mb={x:o.x,y:o.y+25,w:o.w||80,h:20};if(rectsOverlap(pb,mb)){inMud=true;break;}}}
    if(inMud){player.vx*=0.5;player.x-=player.vx*0.5;}

    // Jump pads - super bounce
    for(var i=0;i<jumpPads.length;i++){
        var jp=jumpPads[i];if(!jp.active)continue;
        var jb={x:jp.x,y:jp.y,w:jp.w,h:jp.h};
        if(rectsOverlap(pb,jb)&&player.vy>=0){
            player.vy=JUMP_FORCE*2.2;player.onGround=false;jp.bounce=8;
            sfxJump();spawnParticles(player.x+player.w/2,jp.y,12,'#FFD700',1);
        }
    }

    player.onGround=false;
    for(var i=0;i<plats.length;i++){
        var p=plats[i],platB={x:p.x,y:p.y,w:p.w,h:p.h};
        if(p.type==='conveyor'){if(rectsOverlap({x:player.x,y:player.y+player.vy-2,w:player.w,h:player.h+2},{x:p.x,y:p.y,w:p.w,h:2}))player.vx+=1.2;}
        if(!rectsOverlap(pb,platB))continue;
        var oL=(player.x+player.w)-p.x,oR=(p.x+p.w)-player.x,oT=(player.y+player.h)-p.y,oB=(p.y+p.h)-player.y;
        var minO=Math.min(oL,oR,oT,oB);
        if(minO===oT&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true;}
        else if(minO===oB&&player.vy<0){player.y=p.y+p.h;player.vy=1;}
        else if(minO===oL){player.x=p.x-player.w;player.vx=0;}
        else if(minO===oR){player.x=p.x+p.w;player.vx=0;}
    }
    if((kJust['ArrowUp']||kJust['KeyW']||kJust['Space'])&&player.onGround){player.vy=JUMP_FORCE;player.onGround=false;sfxJump();spawnParticles(player.x+player.w/2,player.y+player.h,8,'#ddd',0.5);}
    if(player.y>H+200){damagePlayer();player.y=0;player.x=60;player.vy=0;}
    camera.targetX=player.x-W/2+player.w/2;camera.targetY=player.y-H/2+player.h/2;
    camera.targetX=Math.max(0,Math.min(camera.targetX,LEVELS[currentLevel].levelW-W));
    camera.targetY=Math.max(-50,Math.min(camera.targetY,100));
    camera.x+=(camera.targetX-camera.x)*0.1;camera.y+=(camera.targetY-camera.y)*0.1;
    if(player.invincible>0)player.invincible--;if(player.speedBoost>0)player.speedBoost--;if(player.doubleScore>0)player.doubleScore--;if(player.iceBox>0)player.iceBox--;
    if(!player.onGround)player.animFrame=2;
    else if(Math.abs(player.vx)>0.5){player.animTimer++;if(player.animTimer>(player.sprinting?4:8)){player.animTimer=0;player.animFrame=player.animFrame===0?1:0;}}
    else{player.animFrame=0;player.animTimer=0;}
    if(player.vx>0.2)player.facing=1;if(player.vx<-0.2)player.facing=-1;
}
function damagePlayer() {
    if(player.invincible>0)return;player.health--;player.invincible=60;sfxDamage();
    shakeTimer=15;shakeIntensity=8;spawnParticles(player.x+player.w/2,player.y+player.h/2,12,'#ff4444',1.5);
    if(player.health<=0){state=STATE.GAMEOVER;sfxGameOver();}
}

function updateEntities() {
    var lvl=LEVELS[currentLevel],pb={x:player.x,y:player.y,w:player.w,h:player.h};
    for(var i=0;i<obstacles.length;i++){
        var o=obstacles[i];
        if(o.s==='hay'){o.x+=o.dx||1.5;if(o.x>o.maxX||o.x<o.minX){o.dx=-(o.dx||1.5);o.x+=o.dx;}}
        else if(o.s==='chicken'){o.timer=(o.timer||0)+1;if(o.timer>90){o.timer=0;o.dx=-(o.dx||1);}o.x+=o.dx||1;if(o.x>o.startX+120||o.x<o.startX){o.dx=-(o.dx||1);}}
        else if(o.s==='tractor'){o.x+=o.dx||2;if(o.x>o.maxX||o.x<o.minX){o.dx=-(o.dx||2);}}
        else if(o.s==='car'){o.x+=o.dx||3;if(o.x>o.maxX||o.x<o.minX){o.dx=-(o.dx||3);}}
    }
    for(var i=0;i<obstacles.length;i++){
        var o=obstacles[i],ob={x:o.x,y:o.y,w:o.w||50,h:o.h||40};
        if(rectsOverlap(pb,ob)){if(o.s==='mud')continue;damagePlayer();player.vx=player.x<o.x?-6:6;player.vy=-6;break;}
    }
    for(var i=collectibles.length-1;i>=0;i--){
        var c=collectibles[i];if(!c.active)continue;
        if(rectsOverlap(pb,{x:c.x,y:c.y,w:28,h:28})){
            var pts=c.points||10;if(player.doubleScore>0)pts*=2;score+=pts;levelScore+=pts;levelItemsCollected++;
            c.active=false;sfxCollect();spawnParticles(c.x+14,c.y+14,10,c.color,1.2);collectibles.splice(i,1);
        }
    }
    for(var i=powerups.length-1;i>=0;i--){
        var pu=powerups[i];if(!pu.active)continue;
        if(rectsOverlap(pb,{x:pu.x,y:pu.y,w:28,h:28})){
            sfxPowerup();spawnParticles(pu.x+14,pu.y+14,15,'#ffff00',2);
            if(pu.s==='H')player.health=Math.min(player.health+1,player.maxHealth);
            else if(pu.s==='S'){player.speedBoost=600;powerupIcons.push({type:'S',timer:600});}
            else if(pu.s==='G'){player.doubleScore=900;powerupIcons.push({type:'G',timer:900});}
            else if(pu.s==='I'){player.iceBox=600;powerupIcons.push({type:'I',timer:600});}
            pu.active=false;powerups.splice(i,1);
        }
    }
    for(var i=powerupIcons.length-1;i>=0;i--){powerupIcons[i].timer--;if(powerupIcons[i].timer<=0)powerupIcons.splice(i,1);}
    if(!truckReached){var tb={x:lvl.truckX,y:476,w:60,h:60};if(rectsOverlap(pb,tb)){truckReached=true;sfxLevelComplete();spawnParticles(lvl.truckX+30,496,20,'#FFD700',3);levelCompleteTimer=120;}}
}

function initLevel(idx) {
    currentLevel=idx;var lvl=LEVELS[idx];resetPlayer();camera.x=0;camera.y=0;camera.targetX=0;camera.targetY=0;
    levelTimer=lvl.timeLimit*60;levelScore=0;levelItemsCollected=0;truckReached=false;levelCompleteTimer=0;
    particles=[];powerupIcons=[];jumpPads=[];player.speedBoost=0;player.doubleScore=0;player.iceBox=0;
    collectibles=[];obstacles=[];powerups=[];levelItems=0;
    var colors={M:'#ffffff',Y:'#f5f5dc',C:'#ffd700',B:'#fffacd',A:'#e0ffff'},points={M:10,Y:20,C:25,B:30,A:15};
    for(var i=0;i<lvl.entities.length;i++){
        var e=lvl.entities[i];
        if(e.t==='C'){collectibles.push({x:e.x,y:e.y,s:e.s,points:points[e.s]||10,color:colors[e.s]||'#fff',active:true,bob:Math.random()*Math.PI*2});levelItems++;}
        else if(e.t==='O'){
            var o={x:e.x,y:e.y,s:e.s,active:true};
            if(e.s==='hay'){o.minX=e.x-80;o.maxX=e.x+80;o.dx=1.5;o.w=40;o.h=35;}
            else if(e.s==='chicken'){o.startX=e.x;o.dx=1;o.w=28;o.h=24;o.y=e.y-20;}
            else if(e.s==='tractor'){o.minX=e.x-120;o.maxX=e.x+120;o.dx=2;o.w=80;o.h=40;o.y=e.y-10;}
            else if(e.s==='mud'){o.w=80;o.h=15;o.y=e.y-10;}
            else if(e.s==='steam'){o.w=40;o.h=50;o.y=e.y-20;o.timer=Math.random()*60;}
            else if(e.s==='crate'){o.w=35;o.h=35;o.y=e.y;}
            else if(e.s==='car'){o.minX=e.x-150;o.maxX=e.x+150;o.dx=3;o.w=70;o.h=30;o.y=e.y-10;}
            else if(e.s==='barrier'){o.w=60;o.h=30;o.y=e.y;}
            else if(e.s==='water'){o.w=100;o.h=30;o.y=e.y-10;}
            obstacles.push(o);
        }else if(e.t==='P'){powerups.push({x:e.x,y:e.y,s:e.s,active:true,bob:Math.random()*Math.PI*2});}
        else if(e.t==='J'){jumpPads.push({x:e.x,y:e.y,w:50,h:14,active:true,bounce:0});}
    }
    state=STATE.PLAYING;
}

function drawPlatforms(lvl,cx,cy){
    for(var i=0;i<lvl.platforms.length;i++){var p=lvl.platforms[i],sx=p.x-cx,sy=p.y-cy;if(sx+p.w<-50||sx>W+50)continue;

        else if(p.type==='wood'){ctx.fillStyle='#8B4513';ctx.fillRect(sx,sy,p.w,p.h);ctx.strokeStyle='#6D4C41';ctx.lineWidth=1;for(var w=0;w<p.w;w+=15){ctx.beginPath();ctx.moveTo(sx+w,sy);ctx.lineTo(sx+w,sy+p.h);ctx.stroke();}}

function drawPlayer(cx,cy){
    if(player.invincible>0&&Math.floor(player.invincible/4)%2===0)return;
    var px=player.x-cx,py=player.y-cy,f=player.facing;
    ctx.save();ctx.translate(px+player.w/2,py+player.h/2);if(f===-1)ctx.scale(-1,1);
    ctx.fillStyle='#2196F3';ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h-8);
    ctx.fillStyle='#FFD700';ctx.fillRect(-player.w/2+5,-player.h/2+15,8,player.h-30);
    ctx.fillStyle='#FFCC80';ctx.beginPath();ctx.arc(0,-player.h/2-2,13,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1565C0';ctx.beginPath();ctx.arc(0,-player.h/2-7,14,Math.PI,0);ctx.fill();ctx.fillRect(-15,-player.h/2-10,30,5);
    ctx.fillStyle='#333';ctx.fillRect(3,-player.h/2-8,3,4);
    var legOff=0;if(!player.onGround)legOff=4;else if(Math.abs(player.vx)>0.5)legOff=player.animFrame===0?-4:4;
    ctx.fillStyle='#1565C0';ctx.fillRect(-8+legOff,player.h/2-8,8,8);ctx.fillRect(0-legOff,player.h/2-8,8,8);
    ctx.fillStyle='#FFCC80';ctx.fillRect(12,-player.h/2+20,5,14);ctx.fillRect(-17,-player.h/2+20,5,14);
    ctx.restore();
    if(player.onGround&&Math.abs(player.vx)>3&&Math.random()<0.3)spawnParticles(player.x+player.w/2+(Math.random()-0.5)*20,player.y+player.h,1,'#c8b89a',0.3);
}

function drawCollectibles(cx,cy){
    for(var i=0;i<collectibles.length;i++){var c=collectibles[i];if(!c.active)continue;var cpx=c.x-cx,cpy=c.y-cy+Math.sin(Date.now()/500+c.bob)*5;if(cpx<-40||cpx>W+40)continue;
        var sp=Math.sin(Date.now()/200+c.bob)*0.4+0.6;ctx.globalAlpha=sp;
        var img=null;
        if(c.s==='M')img=imgMilk;
        else if(c.s==='Y')img=imgYogurt;
        else if(c.s==='C')img=imgCheese;
        else if(c.s==='B')img=imgButter;

        else{ctx.fillStyle=c.color;ctx.fillRect(cpx+4,cpy+6,20,18);}
    }ctx.globalAlpha=1;
}

function drawPowerups(cx,cy){
    for(var i=0;i<powerups.length;i++){var p=powerups[i];if(!p.active)continue;var ppx=p.x-cx,ppy=p.y-cy+Math.sin(Date.now()/400+p.bob)*6;if(ppx<-30||ppx>W+30)continue;
        ctx.fillStyle='#FFD700';ctx.strokeStyle='#FFF';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ppx+14,ppy+14,15,0,Math.PI*2);ctx.fill();ctx.stroke();

    }

function drawJumpPads(cx,cy){
    for(var i=0;i<jumpPads.length;i++){var j=jumpPads[i];if(!j.active)continue;var jx=j.x-cx,jy=j.y-cy;if(jx<-60||jx>W+60)continue;
        if(j.bounce>0)j.bounce-=0.5;
        var compress=j.bounce>0?Math.sin(j.bounce*1.2)*6:0;
        // Base
        ctx.fillStyle='#FF6F00';ctx.fillRect(jx,jy+10-compress,j.w,8+compress);
        // Spring coils
        ctx.strokeStyle='#FFD700';ctx.lineWidth=2;
        for(var c=0;c<4;c++){ctx.beginPath();ctx.moveTo(jx+6+c*10,jy+6-compress*0.5);ctx.lineTo(jx+11+c*10,jy+12-compress*0.5);ctx.stroke();}
        // Top pad
        ctx.fillStyle='#FFAB00';ctx.fillRect(jx+3,jy+3-compress,j.w-6,6);
        // Glow
        ctx.fillStyle='rgba(255,215,0,'+(0.3+Math.sin(Date.now()/300)*0.2)+')';ctx.fillRect(jx-2,jy-2-compress,j.w+4,j.h+6);
    }
}

        else if(o.s==='chicken'){ctx.fillStyle='#FFF8DC';ctx.beginPath();ctx.arc(ox+14,oy+12,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FF6347';ctx.beginPath();ctx.moveTo(ox+24,oy+8);ctx.lineTo(ox+32,oy+2);ctx.lineTo(ox+24,oy+14);ctx.fill();}

    ctx.fillStyle='#0D2E66';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#FFF';ctx.font='bold 36px monospace';ctx.textAlign='center';ctx.fillText('CONTROLS',W/2,H/2-40);
    var ctrls=['Arrow Keys / WASD - Move','SHIFT - Sprint','SPACE / W / UP - Jump','ESC - Pause','Collect dairy items for points','Reach the delivery truck to finish!'];
    ctx.font='15px monospace';for(var i=0;i<ctrls.length;i++)ctx.fillText(ctrls[i],W/2,H/2+i*22);
    var bh=mouseX>W/2-50&&mouseX<W/2+50&&mouseY>H/2+80&&mouseY<H/2+110;ctx.fillStyle=bh?'#29ABE2':'#FFF';ctx.font='bold 18px monospace';ctx.fillText(bh?'> BACK <':'BACK',W/2,H/2+95);
}

function drawGameOver(){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#E53935';ctx.font='bold 48px monospace';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-40);
    ctx.fillStyle='#FFF';ctx.font='18px monospace';ctx.fillText('Score: '+score,W/2,H/2+10);
    var items=[{l:'RETRY',y:H/2+50},{l:'MENU',y:H/2+90}];
    for(var i=0;i<items.length;i++){var it=items[i],h=mouseY>it.y-20&&mouseY<it.y+10&&mouseX>W/2-100&&mouseX<W/2+100;ctx.fillStyle=h?'#29ABE2':'#FFF';ctx.font='bold 22px monospace';ctx.fillText(h?'> '+it.l+' <':it.l,W/2,it.y);}
}

function drawWin(){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#FFD700';ctx.font='bold 48px monospace';ctx.textAlign='center';ctx.fillText('YOU WIN!',W/2,H/2-60);
    ctx.fillStyle='#FFF';ctx.font='20px monospace';ctx.fillText('All deliveries complete!',W/2,H/2-15);ctx.fillText('Final Score: '+score,W/2,H/2+20);
    var h=mouseY>H/2+40-10&&mouseY<H/2+40+20&&mouseX>W/2-100&&mouseX<W/2+100;ctx.fillStyle=h?'#29ABE2':'#FFF';ctx.font='bold 22px monospace';ctx.fillText(h?'> MENU <':'MENU',W/2,H/2+55);
}

function drawPause(){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#FFF';ctx.font='bold 36px monospace';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2-30);
    ctx.font='16px monospace';ctx.fillText('Press ESC to resume',W/2,H/2+20);ctx.fillText('Press R to restart',W/2,H/2+45);ctx.fillText('Press M for menu',W/2,H/2+70);
}

function handleClick(){
    if(!mouseClicked)return;mouseClicked=false;
    if(state===STATE.MENU){
        var items=[{l:'PLAY',y:H/2+30,a:function(){state=STATE.LVLSELECT;}},{l:'SETTINGS',y:H/2+75,a:function(){state=STATE.SETTINGS;}}];
        for(var i=0;i<items.length;i++)if(mouseY>items[i].y-20&&mouseY<items[i].y+10&&mouseX>W/2-100&&mouseX<W/2+100){items[i].a();return;}
    }else if(state===STATE.LVLSELECT){
        for(var l=0;l<LEVELS.length;l++){var lx=W/2-200+(l%3)*150,ly=H/2-100+Math.floor(l/3)*160;if(mouseX>lx-60&&mouseX<lx+60&&mouseY>ly-40&&mouseY<ly+40&&l<=unlockedLevel){initLevel(l);return;}}
        if(mouseX>W/2-50&&mouseX<W/2+50&&mouseY>H/2+180&&mouseY<H/2+210)state=STATE.MENU;
    }else if(state===STATE.SETTINGS){if(mouseX>W/2-50&&mouseX<W/2+50&&mouseY>H/2+80&&mouseY<H/2+110)state=STATE.MENU;}
    else if(state===STATE.GAMEOVER){if(mouseY>H/2+50-20&&mouseY<H/2+50+10&&mouseX>W/2-100&&mouseX<W/2+100)initLevel(currentLevel);else if(mouseY>H/2+90-20&&mouseY<H/2+90+10&&mouseX>W/2-100&&mouseX<W/2+100)state=STATE.MENU;}
    else if(state===STATE.WIN){if(mouseY>H/2+40-10&&mouseY<H/2+40+20&&mouseX>W/2-100&&mouseX<W/2+100)state=STATE.MENU;}
}

// Main loop
function update(){
    if(state===STATE.PLAYING){
        platformCollision();updateEntities();levelTimer--;
        if(levelTimer<=0&&!truckReached){state=STATE.GAMEOVER;sfxGameOver();}
        if(truckReached&&levelCompleteTimer>0){levelCompleteTimer--;if(levelCompleteTimer<=0){if(currentLevel<4&&currentLevel+1>unlockedLevel)unlockedLevel=currentLevel+1;state=STATE.LVLCOMPLETE;}}
        if(truckReached&&levelCompleteTimer===119){score+=500;levelScore+=500;}
        updateParticles();
    }else if(state===STATE.LVLCOMPLETE||state===STATE.GAMEOVER||state===STATE.WIN)updateParticles();
    if(kJust['Enter']){if(state===STATE.LVLCOMPLETE){if(currentLevel<4)initLevel(currentLevel+1);else state=STATE.WIN;}else if(state===STATE.GAMEOVER)initLevel(currentLevel);else if(state===STATE.WIN)state=STATE.MENU;else if(state===STATE.MENU)state=STATE.LVLSELECT;}
    if(kJust['Escape']){if(state===STATE.PLAYING)state=STATE.PAUSED;else if(state===STATE.PAUSED)state=STATE.PLAYING;}
    if(state===STATE.PAUSED){if(kJust['KeyR'])initLevel(currentLevel);if(kJust['KeyM'])state=STATE.MENU;}
    var kp=Object.keys(kJust);for(var i=0;i<kp.length;i++)kJust[kp[i]]=false;
}

function draw(){
    ctx.clearRect(0,0,W,H);ctx.save();
    if(state===STATE.MENU)drawMenu();
    else if(state===STATE.LVLSELECT)drawLevelSelect();
    else if(state===STATE.SETTINGS)drawSettings();
    else{
        var lvl=LEVELS[currentLevel];
        if(shakeTimer>0){var sx=(Math.random()-0.5)*shakeIntensity,sy=(Math.random()-0.5)*shakeIntensity;ctx.setTransform(1,0,0,1,sx,sy);shakeTimer--;shakeIntensity*=0.85;}
        drawBackground(lvl,camera.x,camera.y);drawPlatforms(lvl,camera.x,camera.y);drawTruck(camera.x,camera.y);
        drawCollectibles(camera.x,camera.y);drawPowerups(camera.x,camera.y);drawJumpPads(camera.x,camera.y);drawObstacles(camera.x,camera.y);
        drawPlayer(camera.x,camera.y);drawParticles(camera.x,camera.y);ctx.setTransform(1,0,0,1,0,0);
        drawUI();if(state===STATE.PAUSED)drawPause();if(state===STATE.GAMEOVER)drawGameOver();if(state===STATE.WIN)drawWin();
    }
    ctx.restore();handleClick();
}

var lastTime=performance.now();
function gameLoop(ts){var dt=ts-lastTime;lastTime=ts;if(dt>100)dt=100;update();draw();requestAnimationFrame(gameLoop);}
initAudio();requestAnimationFrame(gameLoop);
</script>
</body>
</html>
