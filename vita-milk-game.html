      }
      var spacing = (W - 60) / sd.cowTarget;
      for (var i = 0; i < sd.cowTarget; i++) {
        sd.cows.push({
          x: 30 + spacing * (i + 0.5) - cowW / 2,
          y: groundY - cowH,
          w: cowW, h: cowH,
          feed: 0, need: 3, happy: 0, vx: 0, vy: 0,
          dir: 1, bob: Math.random() * Math.PI * 2
        });
      }
    }
    // Stage 2
    if (n === 1) {
      sd.facilityX = W * 0.85; sd.facilityY = H * 0.78 - 40;
      sd.milkCows = [];
      sd.deliveredCount = 0; sd.draggingCowIdx = -1;
      var groundY2 = H * 0.78;
      var cowW2 = 120, cowH2 = 80;
      var totalW = cowW2 * 3 + 40;
      var startX = (W - totalW) / 2;
      for (var ci = 0; ci < 3; ci++) {
        var ccx = startX + ci * (cowW2 + 20);
        sd.milkCows.push({
          x: ccx, y: groundY2 - cowH2,
          w: cowW2, h: cowH2,
          udderCX: ccx + cowW2 * 0.44,
          udderCY: (groundY2 - cowH2) + cowH2 * 0.60,
          milkAmount: 0, done: false, delivered: false,
          bucketX: ccx + cowW2 * 0.48,
          bucketY: groundY2 + 4,
          bucketDragX: ccx + cowW2 * 0.48,
          bucketDragY: groundY2 + 4,
          bob: Math.random() * Math.PI * 2
        });
      }
    }
    // Stage 3 (Pasteurization)
    if (n === 2) {
      sd.tankCX = W * 0.5; sd.tankCY = H * 0.45; sd.tankR = Math.min(W, H) * 0.32;
      sd.heating = false; sd.zoneTime = 0; sd.zoneTarget = 12; sd.bubbles = [];
      sd.pasteurTemp = 35; sd.pasteurTime = 0;
    }
    // Stage 4 (Cool the Milk)
    if (n === 3) {
      sd.bucketX = W/2; sd.iceBlocks = []; sd.iceParticles = []; sd.iceSpawnTimer = 0;
      sd.temp = 4.0;
    }
    // Stage 5
    if (n === 4) {
      sd.counterX = W * 0.18; sd.counterY = H * 0.45;
      sd.crateCX = W * 0.72; sd.crateCY = H * 0.50;
    }
  }

  // ─── Input ───
  c.addEventListener('mousedown', function(e) { e.preventDefault(); mouseDown = true;
    var r = c.getBoundingClientRect();
    clickX = e.clientX - r.left; clickY = e.clientY - r.top;
    if (gs === STATE.MENU) handleMenuClick(clickX, clickY);
    else if (gs === STATE.STAGE_CLEAR) handleClearClick();
    else if (gs === STATE.FINAL) handleFinalClick(clickX, clickY);
    else if (gs === STATE.PLAYING && stage === 0) handleStage0Down(clickX, clickY);
    else if (gs === STATE.PLAYING && stage === 1) tryMilk(clickX, clickY);
  });
  c.addEventListener('mouseup', function() { mouseDown = false; sd.grabbedWheat = null; });
  c.addEventListener('mousemove', function(e) { 
    var r = c.getBoundingClientRect();
    clickX = e.clientX - r.left; clickY = e.clientY - r.top;
    if (gs === STATE.PLAYING && stage === 0 && sd.grabbedWheat) { sd.grabbedWheat.x = clickX - sd.wheatOffX; sd.grabbedWheat.y = clickY - sd.wheatOffY; }
  });
  c.addEventListener('click', function(e) {
    if (gs === STATE.PLAYING) {
      var r = c.getBoundingClientRect();
      var cx = e.clientX - r.left, cy = e.clientY - r.top;
      if (stage === 2) handlePasteurClick(cx, cy);
      if (stage === 4) handlePackClick(cx, cy);
    }
  });
  c.addEventListener('touchstart', function(e) { e.preventDefault(); touchActive = true;
    var t = e.touches[0];
    var r = c.getBoundingClientRect();
    clickX = t.clientX - r.left; clickY = t.clientY - r.top;
    if (gs === STATE.MENU) handleMenuClick(clickX, clickY);
    else if (gs === STATE.STAGE_CLEAR) handleClearClick();
    else if (gs === STATE.FINAL) handleFinalClick(clickX, clickY);
    else if (gs === STATE.PLAYING && stage === 0) handleStage0Down(clickX, clickY);
    if (gs === STATE.PLAYING && stage === 1) tryMilk(clickX, clickY);
    if (gs === STATE.PLAYING && stage === 2) handlePasteurClick(clickX, clickY);
    if (gs === STATE.PLAYING && stage === 4) handlePackClick(clickX, clickY);
  });
  c.addEventListener('touchmove', function(e) { e.preventDefault();
    var t = e.touches[0];
    var r = c.getBoundingClientRect();
    clickX = t.clientX - r.left; clickY = t.clientY - r.top;
    if (gs === STATE.PLAYING && stage === 0 && sd.grabbedWheat) { sd.grabbedWheat.x = clickX - sd.wheatOffX; sd.grabbedWheat.y = clickY - sd.wheatOffY; }
  });
  c.addEventListener('touchend', function() { touchActive = false; sd.grabbedWheat = null; });
  window.addEventListener('keydown', function(e) { keys[e.key.toLowerCase()] = true;
    if (e.key === ' ' || e.key === 'ArrowUp') e.preventDefault();
  });
  window.addEventListener('keyup', function(e) { keys[e.key.toLowerCase()] = false; });

  function handleMenuClick(mx, my) {
    stage = 0; totalScore = 0; stageScores = [0,0,0,0,0];
    resetStageData(0);
    gs = STATE.INTRO; introTimer = 0;
  }
  function handleClearClick() { advanceStage(); }
  function handleFinalClick(mx, my) {
    stage = 0; totalScore = 0; stageScores = [0,0,0,0,0];
    resetStageData(0);
    gs = STATE.INTRO; introTimer = 0;
  }
  function handleStage0Down(mx, my) {
    // Find closest active wheat
    var closest = null, closestDist = 45;
    for (var w = 0; w < sd.wheats.length; w++) {
      var wh = sd.wheats[w];
      if (!wh.active) continue;
      var dx = mx - wh.x, dy = my - wh.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < closestDist) { closest = wh; closestDist = dist; }
    }
    if (closest) {
      sd.grabbedWheat = closest;
      sd.wheatOffX = mx - closest.x;
      sd.wheatOffY = my - closest.y;
    }
  }

  function advanceStage() {
    stage++;
    if (stage >= 5) { gs = STATE.FINAL; return; }
    resetStageData(stage);
    gs = STATE.INTRO; introTimer = 0;
  }

  function finishStage() {
    sd.stars = stageScores[stage] >= 80 ? 3 : stageScores[stage] >= 50 ? 2 : 1;
    totalScore += stageScores[stage];
    gs = STATE.STAGE_CLEAR; clearTimer = 0;
    if (stage === 4 && totalScore > bestScore) {
      bestScore = totalScore;
      try { localStorage.setItem('vita-farmtofridge-best', bestScore); } catch(e) {}
    }
  }

  // ─── Update ───
  function update(dt) {
    if (gs === STATE.INTRO) { introTimer += dt; if (introTimer > 2.5) { gs = STATE.PLAYING; introTimer = 0; } return; }
    if (gs === STATE.STAGE_CLEAR) { clearTimer += dt; return; }
    if (gs !== STATE.PLAYING) return;

    if (stage === 0) updateStage0(dt);
    else if (stage === 1) updateStage1(dt);
    else if (stage === 2) updateStage2(dt);
    else if (stage === 3) updateStage3(dt);
    else if (stage === 4) updateStage4(dt);
  }

  // Stage 0: Feed cows
  function updateStage0(dt) {
    var groundY = H * 0.78;
    for (var i = 0; i < sd.cows.length; i++) {
      var cow = sd.cows[i];
      cow.bob += dt * 2;
      if (cow.feed >= cow.need) continue;

      for (var w = sd.wheats.length - 1; w >= 0; w--) {
        var wh = sd.wheats[w];
        if (!wh.active) continue;
        if (wh === sd.grabbedWheat) continue; // being dragged
        var dx = wh.x - (cow.x + cow.w / 2);
        var dy = wh.y - (cow.y + cow.h / 2);
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 50) {
          cow.feed++;
          cow.happy = 0.8;
          wh.active = false; // wheat eaten, disappears
          if (cow.feed >= cow.need) { sd.fedCount++; stageScores[stage] += 15; }
          // Spawn new wheat elsewhere
          spawnWheat(groundY);
        }
      }
      if (cow.happy > 0) cow.happy = Math.max(0, cow.happy - dt);
    }
    // Ensure at least 4 active wheats
    var activeCount = 0;
    for (var w = 0; w < sd.wheats.length; w++) {
      if (sd.wheats[w].active) activeCount++;
    }
    while (activeCount < 4) {
      spawnWheat(groundY);
      activeCount++;
    }
    if (sd.fedCount >= sd.cowTarget) { stageScores[stage] = Math.max(20, stageScores[stage]); finishStage(); }
  }

  function spawnWheat(groundY) {
    sd.wheats.push({
      x: W * 0.1 + Math.random() * W * 0.6,
      y: groundY - 20 - Math.random() * 14,
      active: true
    });
  }

  // Stage 1: Milking - click udder, drag individual buckets
  function updateStage1(dt) {
    // Drag a cow's bucket to facility
    if (sd.bucketDragging) {
      var cow = sd.milkCows[sd.draggingCowIdx];
      cow.bucketDragX = clickX - sd.dragOffX;
      cow.bucketDragY = clickY - sd.dragOffY;
      var dfx = cow.bucketDragX - sd.facilityX, dfy = cow.bucketDragY - sd.facilityY;
      if (Math.sqrt(dfx*dfx + dfy*dfy) < 60) {
        // Bucket delivered!
        cow.delivered = true;
        sd.deliveredCount++;
        stageScores[stage] += 20;
        sd.bucketDragging = false;
        sd.draggingCowIdx = -1;
        if (sd.deliveredCount >= 3) { finishStage(); }
      }
    }
    if (!mouseDown && !touchActive) sd.bucketDragging = false;
  }

  function tryMilk(mx, my) {
    // Already dragging - ignore
    if (sd.bucketDragging) return;

    // Check if clicking a done cow's bucket to pick it up
    for (var ci = 0; ci < sd.milkCows.length; ci++) {
      var cow = sd.milkCows[ci];
      if (!cow.done || cow.delivered) continue;
      var dx2 = mx - cow.bucketDragX, dy2 = my - cow.bucketDragY;
      if (Math.sqrt(dx2*dx2 + dy2*dy2) < 50) {
        sd.bucketDragging = true;
        sd.draggingCowIdx = ci;
        sd.dragOffX = mx - cow.bucketDragX;
        sd.dragOffY = my - cow.bucketDragY;
        return;
      }
    }

    // Milk cows
    for (var ci = 0; ci < sd.milkCows.length; ci++) {
      var cow2 = sd.milkCows[ci];
      if (cow2.done) continue;
      var dx = mx - cow2.udderCX, dy = my - cow2.udderCY;
      if (Math.sqrt(dx*dx + dy*dy) < 50) {
        cow2.milkAmount += 15 + Math.floor(Math.random() * 7);
        stageScores[stage] += 2;
        sd.milkStreams.push({ life: 0.5, x: cow2.udderCX, y: cow2.udderCY, bucketX: cow2.bucketX, bucketY: cow2.bucketY });
        if (cow2.milkAmount >= sd.milkTarget) {
          cow2.done = true;
          stageScores[stage] += 10;
        }
        return;
      }
    }
  }

  // Stage 3: Cool the Milk - catch stars
  function updateStage3(dt) {
    // Move bucket to mouse/touch
    sd.bucketX = clickX;
    if (sd.bucketX < 30) sd.bucketX = 30;
    if (sd.bucketX > W - 30) sd.bucketX = W - 30;

    // Spawn falling stars
    sd.iceSpawnTimer += dt;
    if (sd.iceSpawnTimer > 0.5) {
      sd.iceSpawnTimer = 0;
      var isHeat = Math.random() < 0.4;
      sd.iceBlocks.push({
        x: 40 + Math.random() * (W - 80),
        y: -20,
        r: 16 + Math.random() * 12,
        vy: 180 + Math.random() * 120,
        type: isHeat ? 'heat' : 'ice',
        rot: Math.random() * Math.PI * 2,
        sparkle: Math.random() * Math.PI * 2
      });
    }

    // Update blocks
    for (var i = sd.iceBlocks.length - 1; i >= 0; i--) {
      var b = sd.iceBlocks[i];
      b.y += b.vy * dt;
      b.rot += dt * 3;
      b.sparkle += dt * 5;
      if (b.y > H + 40) { sd.iceBlocks.splice(i, 1); continue; }

      // Collision with bucket
      var dx = Math.abs(b.x - sd.bucketX);
      var dy = b.y - (H * 0.78 - 10);
      if (dx < 40 && dy > -20 && dy < 15) {
        if (b.type === 'ice') {
          stageScores[stage] += 100;
          // Blue splash particles
          for (var j = 0; j < 8; j++) {
            sd.iceParticles.push({ x: b.x, y: H*0.78-10, vx: (Math.random()-0.5)*120, vy: -50-Math.random()*80, life: 0.6, color: '#3b82f6' });
          }
        } else {
          stageScores[stage] = Math.max(0, stageScores[stage] - 200);
          // Yellow danger particles
          for (var j = 0; j < 8; j++) {
            sd.iceParticles.push({ x: b.x, y: H*0.78-10, vx: (Math.random()-0.5)*120, vy: -50-Math.random()*80, life: 0.6, color: '#f59e0b' });
          }
        }
        sd.iceBlocks.splice(i, 1);
      }
    }

    // Update particles
    for (var i = sd.iceParticles.length - 1; i >= 0; i--) {
      var p = sd.iceParticles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 120 * dt;
      p.life -= dt;
      if (p.life <= 0) sd.iceParticles.splice(i, 1);
    }

    // Win condition: reach 1000 points
    if (stageScores[stage] >= 1000) {
      stageScores[stage] = 1000;
      finishStage();
    }
  }

  // Stage 2: Pasteurization - heat the milk
  function updateStage2(dt) {
    sd.pasteurTime += dt;
    // Heating: hold mouse/touch to apply heat
    if (mouseDown || touchActive || keys[' '] || keys['arrowup']) {
      sd.heating = true;
      sd.pasteurTemp += dt * 18;
    } else {
      sd.heating = false;
      sd.pasteurTemp -= dt * 9;
    }
    sd.pasteurTemp = Math.max(20, Math.min(95, sd.pasteurTemp));

    // Sweet zone check (68-78C)
    if (sd.pasteurTemp >= 68 && sd.pasteurTemp <= 78) {
      sd.zoneTime += dt;
      stageScores[stage] += Math.floor(dt * 3);
    } else if (sd.pasteurTemp > 88 || sd.pasteurTemp < 30) {
      stageScores[stage] = Math.max(0, stageScores[stage] - Math.floor(dt * 6));
    } else {
      stageScores[stage] = Math.max(0, stageScores[stage] - Math.floor(dt * 1));
    }

    // Bubbles when heating
    if (sd.heating && Math.random() < dt * 8) {
      sd.bubbles.push({
        x: sd.tankCX + (Math.random() - 0.5) * sd.tankR * 1.4,
        y: sd.tankCY + sd.tankR * 0.3 + Math.random() * 30,
        r: 2 + Math.random() * 5,
        vy: -40 - Math.random() * 60,
        life: 0.6 + Math.random() * 0.4
      });
    }
    // Steam when hot
    if (sd.pasteurTemp > 75 && Math.random() < dt * 4) {
      sd.bubbles.push({
        x: sd.tankCX + (Math.random() - 0.5) * sd.tankR * 1.2,
        y: sd.tankCY - sd.tankR * 0.4,
        r: 3 + Math.random() * 6,
        vy: -20 - Math.random() * 30,
        life: 0.8 + Math.random() * 0.6,
        steam: true
      });
    }

    // Update bubbles/steam
    for (var i = sd.bubbles.length - 1; i >= 0; i--) {
      var b = sd.bubbles[i];
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0) sd.bubbles.splice(i, 1);
    }

    if (sd.zoneTime >= sd.zoneTarget) {
      stageScores[stage] = Math.max(10, stageScores[stage] + Math.floor((sd.zoneTime - sd.zoneTarget + 2) * 5));
      finishStage();
    }
  }

  function handlePasteurClick(mx, my) {
    // Heat applied continuously via mouseDown/touchActive in updateStage3
    // Single clicks add a small heat boost
    sd.pasteurTemp += 2;
  }

  // Stage 4: Pack & Deliver
  function updateStage4(dt) {
    // Bottle on counter is grabbed - follow cursor
    if (sd.grabbedIdx >= 0) {
      var gb = sd.packBottles[sd.grabbedIdx];
      gb.x += (clickX - gb.x) * 0.25;
      gb.y += (clickY - gb.y) * 0.25;
    }
    // Spawn new bottles on counter
    sd.packSpawnTimer += dt;
    var onCounter = 0;
    for (var i = 0; i < sd.packBottles.length; i++) {
      if (!sd.packBottles[i].packed) onCounter++;
    }
    if (onCounter < 4 && sd.packSpawnTimer > 0.5 && sd.packedCount + onCounter < sd.packTarget) {
      sd.packSpawnTimer = 0;
      var slot = 0;
      var taken = [];
      for (var i = 0; i < sd.packBottles.length; i++) {
        if (!sd.packBottles[i].packed) taken.push(i);
      }
      for (var s = 0; s < 6; s++) {
        var found = false;
        for (var t = 0; t < taken.length; t++) {
          if (sd.packBottles[taken[t]].slotIdx === s) { found = true; break; }
        }
        if (!found) { slot = s; break; }
      }
      sd.packBottles.push({
        x: sd.counterX + slot * 70, y: sd.counterY - 30,
        slotIdx: slot, packed: false, grabbed: false
      });
    }
  }

  function handlePackClick(mx, my) {
    // Check if clicking on the crate to drop
    if (sd.grabbedIdx >= 0) {
      var dx = mx - sd.crateCX, dy = my - sd.crateCY;
      if (Math.abs(dx) < 70 && Math.abs(dy) < 50) {
        // Drop into crate
        var gb = sd.packBottles[sd.grabbedIdx];
        gb.packed = true;
        gb.grabbed = false;
        gb.x = sd.crateCX - 40 + (sd.packedCount % 4) * 28;
        gb.y = sd.crateCY - 15 + Math.floor(sd.packedCount / 4) * 30;
        sd.packedCount++;
        sd.grabbedIdx = -1;
        stageScores[stage] += 8;
        if (sd.packedCount >= sd.packTarget) {
          stageScores[stage] = Math.max(10, stageScores[stage]);
          finishStage();
        }
        return;
      }
    }
    // Check if clicking a bottle on counter to grab
    if (sd.grabbedIdx >= 0) return; // already holding
    for (var i = sd.packBottles.length - 1; i >= 0; i--) {
      var b = sd.packBottles[i];
      if (b.packed) continue;
      var dx = mx - b.x, dy = my - b.y;
      if (Math.abs(dx) < 24 && Math.abs(dy) < 36) {
        b.grabbed = true;
        sd.grabbedIdx = i;
        return;
      }
    }
  }

  // ─── Draw Functions ───

  function drawBackground(skyTop, skyBot, groundCol) {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, skyTop || '#87CEEB');
    grad.addColorStop(1, skyBot || '#4a8ab5');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    if (groundCol) { ctx.fillStyle = groundCol; ctx.fillRect(0, H*0.78, W, H*0.22); }
  }

  function drawMenu() {
    // White milk background with subtle gradient
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#fefefe'); bg.addColorStop(0.5, '#fafaf7'); bg.addColorStop(1, '#f5f2ed');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // Subtle milk splash dots
    for (var i = 0; i < 30; i++) {
      var sx = (i * 211) % W, sy = (i * 137) % H;
      ctx.fillStyle = 'rgba(19,75,141,' + (0.03 + 0.03 * Math.sin(Date.now()/3000 + i)) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, 2 + i % 4, 0, Math.PI * 2); ctx.fill();
    }

    var cx = W / 2;

    // ─── Logo ───
    var logoMaxW = Math.min(240, W * 0.35);
    var logoMaxH = Math.min(120, H * 0.18);
    var logoScale = Math.min(logoMaxW / logoImg.width, logoMaxH / logoImg.height);
    var logoW = logoImg.width * logoScale;
    var logoH = logoImg.height * logoScale;
    var logoY = H * 0.1;
    try { ctx.drawImage(logoImg, cx - logoW/2, logoY, logoW, logoH); } catch(e) {}

    // ─── Title ───
    var ty = logoY + logoH + Math.min(20, H * 0.03);
    ctx.fillStyle = N;
    ctx.font = 'bold ' + Math.min(36, W * 0.05) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Farm to Fridge', cx, ty);

    ctx.fillStyle = '#555';
    ctx.font = Math.min(15, W * 0.022) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('Learn how milk is made in 5 fun stages!', cx, ty + Math.min(28, W * 0.04));

    // ─── Process icons ───
    var iconY = ty + Math.min(60, W * 0.085);
    var icons = ['F','M','P','C','B'];
    var iconX = cx - (icons.length - 1) * 38 / 2;
    for (var i = 0; i < icons.length; i++) {
      var ix = iconX + i * 38;
      // Circle
      ctx.fillStyle = STAGES[i].color;
      ctx.beginPath(); ctx.arc(ix, iconY, 14, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 13px "Segoe UI",system-ui,sans-serif';
      ctx.fillText(icons[i], ix, iconY + 5);
      // Connector line
      if (i < icons.length - 1) {
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(ix + 15, iconY); ctx.lineTo(ix + 22, iconY); ctx.stroke();
      }
      // Stage label
      ctx.fillStyle = '#333';
      ctx.font = 'bold 9px "Segoe UI",system-ui,sans-serif';
      var sName = ['Feed','Milk','Pasteurize','Cool','Bottle'][i];
      ctx.fillText(sName, ix, iconY + 28);
    }

    // ─── Play button ───
    var bw = 200, bh = 54, by = H * 0.7;
    var pulse = 1 + Math.sin(Date.now()/500) * 0.025;
    ctx.save(); ctx.translate(cx, by + bh/2); ctx.scale(pulse, pulse);
    // Button shadow
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    rrect(-bw/2 + 2, -bh/2 + 2, bw, bh, 27); ctx.fill();
    rrect(-bw/2, -bh/2, bw, bh, 27);
    ctx.fillStyle = G; ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 20px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('PLAY', 0, 7);
    ctx.restore();

    ctx.fillStyle = '#888';
    ctx.font = Math.min(13, W * 0.019) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('Click or tap to start', cx, by + bh + 32);
    if (bestScore > 0) {
      ctx.fillStyle = N; ctx.font = 'bold 14px "Segoe UI",system-ui,sans-serif';
      ctx.fillText('Best Score: ' + bestScore, cx, by + bh + 56);
    }

    // ─── Footer ───
    ctx.fillStyle = 'rgba(19,75,141,0.4)';
    ctx.font = 'italic ' + Math.min(12, W*0.017) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('Qumeshtorja Vita — Fresh Thinking. Fresh Dairy.', cx, H - 20);
  }

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  function drawStageIntro() {
    drawBackground('#0d1a30', '#060f1c', '');
    var alpha = Math.min(1, introTimer / 0.6);
    ctx.globalAlpha = alpha;

    var st = STAGES[stage];
    ctx.fillStyle = st.color;
    ctx.font = 'bold 16px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Stage ' + (stage + 1) + ' of 5', W/2, H*0.22);

    ctx.fillStyle = st.color;
    ctx.font = 'bold ' + Math.min(42, W*0.06) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(st.name, W/2, H*0.32);

    ctx.fillStyle = st.color;
    ctx.beginPath(); ctx.arc(W/2, H*0.39, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 19px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(st.icon, W/2, H*0.39 + 7);

    ctx.fillStyle = '#ddd';
    ctx.font = Math.min(15, W*0.022) + 'px "Segoe UI",system-ui,sans-serif';
    var words = st.desc.split(' ');
    var line = ''; var ly = H*0.50;
    for (var i = 0; i < words.length; i++) {
      var test = line + words[i] + ' ';
      if (ctx.measureText(test).width > W * 0.75) { ctx.fillText(line, W/2, ly); line = words[i] + ' '; ly += 26; }
      else line = test;
    }
    ctx.fillText(line, W/2, ly);

    // Progress bar
    var pw = 200, ph = 4, px = W/2 - pw/2, py = H*0.72;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    rrect(px, py, pw, ph, 2); ctx.fill();
    ctx.fillStyle = st.color;
    rrect(px, py, pw * introTimer / 2.5, ph, 2); ctx.fill();

    ctx.globalAlpha = 1;
  }

  function drawStageClear() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    var st = STAGES[stage];
    var ca = Math.min(1, clearTimer / 0.5);
    ctx.globalAlpha = ca;
    ctx.fillStyle = st.color;
    ctx.font = 'bold ' + Math.min(36, W*0.052) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Stage Complete!', W/2, H*0.28);

    // Stars
    for (var i = 0; i < 3; i++) {
      var sx = W/2 + (i-1)*50, sy = H*0.38;
      ctx.fillStyle = i < sd.stars ? G : 'rgba(255,255,255,0.2)';
      ctx.font = 'bold 32px "Segoe UI",system-ui,sans-serif';
      ctx.fillText('*', sx, sy);
    }

    ctx.fillStyle = '#fff';
    ctx.font = Math.min(16, W*0.024) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(stageScores[stage] + ' points', W/2, H*0.48);

    // Fact box
    var fw = Math.min(500, W*0.7), fh = 70, fx = W/2 - fw/2, fy = H*0.55;
    ctx.fillStyle = 'rgba(19,75,141,0.5)';
    rrect(fx, fy, fw, fh, 12); ctx.fill();
    ctx.fillStyle = G;
    ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('Did you know?', W/2, fy + 20);
    ctx.fillStyle = '#ddd';
    ctx.font = Math.min(13, W*0.02) + 'px "Segoe UI",system-ui,sans-serif';
    var fwords = st.fact.split(' ');
    var fline = ''; var fly = fy + 42;
    for (var i = 0; i < fwords.length; i++) {
      var ftest = fline + fwords[i] + ' ';
      if (ctx.measureText(ftest).width > fw - 30) { ctx.fillText(fline, W/2, fly); fline = fwords[i] + ' '; fly += 22; }
      else fline = ftest;
    }
    ctx.fillText(fline, W/2, fly);

    // Continue button
    var bw = 170, bh = 44, bx = W/2 - bw/2, by = H*0.78;
    rrect(bx, by, bw, bh, 22);
    ctx.fillStyle = G; ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 17px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(stage < 4 ? 'NEXT STAGE' : 'SEE RESULTS', W/2, by + bh/2 + 6);
    ctx.globalAlpha = 1;
  }

  function drawFinal() {
    drawBackground('#0d1a30', '#060f1c', '');
    ctx.fillStyle = G;
    ctx.font = 'bold ' + Math.min(42, W*0.06) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Farm to Fridge Complete!', W/2, H*0.15);
    ctx.fillStyle = '#fff';
    ctx.font = Math.min(20, W*0.03) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('Total Score: ' + totalScore, W/2, H*0.22);

    if (totalScore >= bestScore && totalScore > 0) {
      ctx.fillStyle = G;
      ctx.font = 'bold 16px "Segoe UI",system-ui,sans-serif';
      ctx.fillText('NEW BEST!', W/2, H*0.28);
    }

    // Stage results
    var sy = H*0.35;
    for (var i = 0; i < 5; i++) {
      var st = STAGES[i];
      var sx = W/2 - 250, sw = 500;
      if (W < 600) { sx = 20; sw = W - 40; }
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      rrect(sx, sy, sw, 38, 10); ctx.fill();
      ctx.fillStyle = st.color;
      ctx.font = 'bold 14px "Segoe UI",system-ui,sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(st.icon + '  ' + st.name, sx + 14, sy + 26);

      var starStr = '';
      var ss = stageScores[i] >= 80 ? 3 : stageScores[i] >= 50 ? 2 : 1;
      for (var j = 0; j < ss; j++) starStr += '*';
      ctx.fillStyle = G;
      ctx.textAlign = 'right';
      ctx.fillText(starStr, sx + sw - 60, sy + 26);
      ctx.fillStyle = '#aaa';
      ctx.fillText(stageScores[i] + ' pts', sx + sw - 14, sy + 26);
      sy += 48;
    }

    // Milk journey fact
    ctx.fillStyle = 'rgba(19,75,141,0.45)';
    rrect(W/2 - 230, sy + 10, 460, 48, 12); ctx.fill();
    ctx.fillStyle = '#ccc';
    ctx.font = 'italic ' + Math.min(13, W*0.019) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Now you know how Vita milk goes from farm to your fridge!', W/2, sy + 28);
    ctx.fillText('Fresh, safe, and delicious - every single day.', W/2, sy + 44);

    // Replay button
    var bw = 190, bh = 46, bx = W/2 - bw/2, by = sy + 80;
    rrect(bx, by, bw, bh, 23);
    ctx.fillStyle = G; ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 18px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('PLAY AGAIN', W/2, by + bh/2 + 6);
  }

  // ─── Stage Draw Functions ───

  function drawStage0() {
    var groundY = H * 0.78;
    // Sky
    var grad = ctx.createLinearGradient(0, 0, 0, groundY);
    grad.addColorStop(0, '#87CEEB'); grad.addColorStop(0.7, '#c8e6c9'); grad.addColorStop(1, '#a5d6a7');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, groundY);
    // Ground
    ctx.fillStyle = '#5a9e3a'; ctx.fillRect(0, groundY, W, H - groundY);
    // Dirt path near cows
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(0, groundY - 6, W, 20);

    // Fence
    ctx.strokeStyle = '#6d4c00'; ctx.lineWidth = 3; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(0, groundY - 16); ctx.lineTo(W, groundY - 16); ctx.stroke();
    for (var fx = 20; fx < W; fx += 80) {
      ctx.fillStyle = '#8B6914'; ctx.fillRect(fx, groundY - 28, 6, 14);
    }

    // Wheat on ground (all active pieces)
    for (var wi = 0; wi < sd.wheats.length; wi++) {
      var wh = sd.wheats[wi];
      if (!wh.active) continue;
      var wx = wh.x, wy = wh.y;
      // Stems
      for (var s = -8; s <= 8; s += 6) {
        ctx.strokeStyle = '#8B9A2B'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(wx + s + 2, wy + 20);
        ctx.quadraticCurveTo(wx + s, wy, wx + s + 3, wy - 14);
        ctx.stroke();
      }
      // Wheat grains
      for (var g = -3; g <= 3; g += 3) {
        ctx.fillStyle = '#D4A830';
        ctx.beginPath(); ctx.ellipse(wx + g + 8, wy - 10, 4, 7, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(wx + g + 12, wy - 8, 4, 7, -0.3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#E8C840';
      ctx.beginPath(); ctx.ellipse(wx + 2, wy - 12, 5, 9, 0, 0, Math.PI * 2); ctx.fill();
      // Glow
      ctx.fillStyle = 'rgba(255,255,200,0.25)';
      ctx.beginPath(); ctx.arc(wx + 2, wy - 2, 20, 0, Math.PI * 2); ctx.fill();
      // Grab highlight
      if (wh === sd.grabbedWheat) {
        ctx.strokeStyle = G; ctx.lineWidth = 2; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(wx + 2, wy - 2, 25, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Cows on ground
    for (var i = 0; i < sd.cows.length; i++) {
      var cow = sd.cows[i];
      var cx = cow.x, cy = cow.y + Math.sin(cow.bob) * 2;
      var cw = cow.w, ch = cow.h;
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath(); ctx.ellipse(cx + cw/2, groundY - 2, cw*0.42, 4, 0, 0, Math.PI*2); ctx.fill();

      ctx.save();
      // Clip to cow area for clean spots
      ctx.beginPath(); ctx.ellipse(cx + cw/2, cy + ch*0.45, cw*0.48, ch*0.42, 0, 0, Math.PI*2); ctx.clip();

      // Base body color
      ctx.fillStyle = '#fefef8';
      ctx.fillRect(cx - 10, cy - 20, cw + 20, ch + 40);

      // Holstein spots
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(cx + cw*0.25, cy + ch*0.3, cw*0.18, ch*0.22, 0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + cw*0.6, cy + ch*0.25, cw*0.22, ch*0.18, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + cw*0.4, cy + ch*0.55, cw*0.16, ch*0.2, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + cw*0.75, cy + ch*0.5, cw*0.13, ch*0.16, 0.3, 0, Math.PI*2); ctx.fill();

      ctx.restore();

      // Neck
      ctx.fillStyle = '#fefef8';
      ctx.beginPath(); ctx.moveTo(cx + cw*0.85, cy + ch*0.15); ctx.lineTo(cx + cw + 5, cy + ch*0.05);
      ctx.lineTo(cx + cw + 5, cy + ch*0.35); ctx.lineTo(cx + cw*0.8, cy + ch*0.4);
      ctx.closePath(); ctx.fill();
      // Neck spot
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(cx + cw*0.9, cy + ch*0.22, cw*0.06, ch*0.08, 0, 0, Math.PI*2); ctx.fill();

      // Head
      ctx.fillStyle = '#fefef8';
      ctx.beginPath(); ctx.ellipse(cx + cw + 12, cy + ch*0.18, ch*0.3, ch*0.22, 0.15, 0, Math.PI*2); ctx.fill();
      // Forehead spot
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(cx + cw + 6, cy + ch*0.1, ch*0.12, ch*0.08, 0, 0, Math.PI*2); ctx.fill();
      // Muzzle
      ctx.fillStyle = '#f0d5d0';
      ctx.beginPath(); ctx.ellipse(cx + cw + 24, cy + ch*0.24, ch*0.14, ch*0.11, 0, 0, Math.PI*2); ctx.fill();
      // Nostrils
      ctx.fillStyle = '#c09090';
      ctx.beginPath(); ctx.arc(cx + cw + 21, cy + ch*0.22, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + cw + 27, cy + ch*0.22, 2, 0, Math.PI*2); ctx.fill();
      // Eye
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(cx + cw + 14, cy + ch*0.12, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx + cw + 13, cy + ch*0.11, 1.2, 0, Math.PI*2); ctx.fill();
      // Ear
      ctx.fillStyle = '#fefef8';
      ctx.beginPath(); ctx.ellipse(cx + cw + 4, cy + ch*0.02, 7, 14, 0.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(cx + cw + 4, cy + ch*0.02, 5, 10, 0.5, 0, Math.PI*2); ctx.fill();
      // Horns
      ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx + cw + 8, cy + ch*0.02); ctx.lineTo(cx + cw + 12, cy - ch*0.08); ctx.stroke();

      // Front leg
      ctx.fillStyle = '#fafaf5';
      ctx.beginPath(); ctx.moveTo(cx + cw*0.72, cy + ch*0.7); ctx.lineTo(cx + cw*0.78, cy + ch*0.7);
      ctx.lineTo(cx + cw*0.76, groundY); ctx.lineTo(cx + cw*0.7, groundY);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(cx + cw*0.7, groundY - 4, cw*0.07, 4);

      // Back leg
      ctx.fillStyle = '#fafaf5';
      ctx.beginPath(); ctx.moveTo(cx + cw*0.18, cy + ch*0.7); ctx.lineTo(cx + cw*0.26, cy + ch*0.7);
      ctx.lineTo(cx + cw*0.24, groundY); ctx.lineTo(cx + cw*0.16, groundY);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(cx + cw*0.16, groundY - 4, cw*0.07, 4);

      // Udder
      ctx.fillStyle = '#f5d0d8';
      ctx.beginPath(); ctx.ellipse(cx + cw*0.48, cy + ch*0.72, ch*0.2, ch*0.15, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e8b8c0';
      ctx.beginPath(); ctx.ellipse(cx + cw*0.48, cy + ch*0.7, ch*0.13, ch*0.09, 0, 0, Math.PI*2); ctx.fill();

      // Tail
      ctx.strokeStyle = '#fefef8'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx + 2, cy + ch*0.35);
      ctx.quadraticCurveTo(cx - 10, cy + ch*0.2, cx - 8, cy + ch*0.55);
      ctx.stroke();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(cx - 8, cy + ch*0.55, 3, 6, 0, 0, Math.PI*2); ctx.fill();

      // Feed progress
      for (var j = 0; j < cow.need; j++) {
        ctx.fillStyle = j < cow.feed ? '#4ade80' : 'rgba(255,255,255,0.3)';
        ctx.fillRect(cx + j*12 + cw*0.15, cy - 10, 8, 5);
      }
      // Ready heart
      if (cow.feed >= cow.need) {
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 16px "Segoe UI",system-ui,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('v', cx + cw/2, cy - 14);
      }
      if (cow.happy > 0) {
        ctx.fillStyle = 'rgba(255,255,0,'+cow.happy+')';
        ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
        ctx.fillText('^', cx + cw/2, cy - 4);
      }
    }

    drawHUD('Drag wheat to feed cows! (' + sd.fedCount + '/' + sd.cowTarget + ')');
  }

  function drawCowHolstein(cx, cy, cw, ch, groundY, done) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(cx + cw/2, groundY - 2, cw*0.45, 5, 0, 0, Math.PI * 2); ctx.fill();

    // ── Body (oval) ──
    ctx.fillStyle = '#fafaf7';
    ctx.beginPath(); ctx.ellipse(cx + cw/2, cy + ch*0.35, cw*0.44, ch*0.36, 0, 0, Math.PI * 2); ctx.fill();

    // Black spots (ellipse clip mask style)
    ctx.save();
    ctx.beginPath(); ctx.ellipse(cx + cw/2, cy + ch*0.35, cw*0.44, ch*0.36, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(cx + cw*0.25, cy + ch*0.28, cw*0.16, ch*0.18, -0.15, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + cw*0.72, cy + ch*0.30, cw*0.18, ch*0.15, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + cw*0.50, cy + ch*0.48, cw*0.20, ch*0.14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + cw*0.38, cy + ch*0.22, cw*0.10, ch*0.10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // ── Neck (trapezoid) ──
    ctx.fillStyle = '#fafaf7';
    ctx.beginPath();
    ctx.moveTo(cx + cw*0.72, cy + ch*0.15);
    ctx.lineTo(cx + cw*0.68, cy + ch*0.42);
    ctx.lineTo(cx + cw*0.80, cy + ch*0.42);
    ctx.lineTo(cx + cw*0.82, cy + ch*0.15);
    ctx.closePath(); ctx.fill();
    // Neck spot
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(cx + cw*0.75, cy + ch*0.30, cw*0.05, ch*0.08, 0, 0, Math.PI * 2); ctx.fill();

    // ── Legs (trapezoid to ground) ──
    for (var li = 0; li < 2; li++) {
      var lx = li === 0 ? cx + cw*0.20 : cx + cw*0.62;
      var legW = 8;
      ctx.fillStyle = '#f5f5f0';
      ctx.beginPath();
      ctx.moveTo(lx - legW/2 + 2, cy + ch*0.60);
      ctx.lineTo(lx + legW/2 - 2, cy + ch*0.60);
      ctx.lineTo(lx + legW/2, groundY);
      ctx.lineTo(lx - legW/2, groundY);
      ctx.closePath(); ctx.fill();
      // Black hooves
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(lx - legW/2, groundY - 4, legW, 4);
      ctx.fillStyle = '#f5f5f0';
    }

    // ── Udder (pink) ──
    var ux = cx + cw*0.44, uy = cy + ch*0.60;
    ctx.fillStyle = '#f5c6d0';
    ctx.beginPath(); ctx.ellipse(ux, uy + 2, 15, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8a8b5';
    ctx.beginPath(); ctx.ellipse(ux, uy, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
    // Teats
    for (var ti = -7; ti <= 7; ti += 7) {
      ctx.fillStyle = '#fad5de';
      ctx.beginPath(); ctx.ellipse(ux + ti, uy + 10, 4, 7, 0, 0, Math.PI * 2); ctx.fill();
    }

    // ── Tail ──
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx + cw*0.08, cy + ch*0.20);
    ctx.quadraticCurveTo(cx + cw*0.02, cy + ch*0.08, cx + cw*0.02, cy + ch*0.45);
    ctx.stroke();
    // Tuft
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(cx + cw*0.02, cy + ch*0.48, 5, 8, -0.3, 0, Math.PI * 2); ctx.fill();

    // ── Head ──
    var hx = cx + cw*0.84, hy = cy + ch*0.08;
    // Head oval
    ctx.fillStyle = '#fefefe';
    ctx.beginPath(); ctx.ellipse(hx, hy, ch*0.30, ch*0.22, 0.05, 0, Math.PI * 2); ctx.fill();
    // Head spot
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(hx - 4, hy - 4, ch*0.10, ch*0.08, 0, 0, Math.PI * 2); ctx.fill();

    // Muzzle (pink)
    ctx.fillStyle = '#f0d5d0';
    ctx.beginPath(); ctx.ellipse(hx + 10, hy + 4, ch*0.13, ch*0.10, 0, 0, Math.PI * 2); ctx.fill();
    // Nostrils
    ctx.fillStyle = '#c09090';
    ctx.beginPath(); ctx.arc(hx + 9, hy + 2, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx + 13, hy + 2, 1.8, 0, Math.PI * 2); ctx.fill();

    // Eye + highlight
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(hx + 5, hy - 5, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(hx + 4, hy - 6, 1, 0, Math.PI * 2); ctx.fill();

    // 2-tone ear
    ctx.fillStyle = '#fefefe';
    ctx.beginPath(); ctx.ellipse(hx - 8, hy - 12, 8, 5, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(hx - 8, hy - 12, 5, 3, -0.5, 0, Math.PI * 2); ctx.fill();

    // Horns
    ctx.strokeStyle = '#e8d8b0'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hx - 6, hy - 14);
    ctx.quadraticCurveTo(hx - 10, hy - 24, hx - 5, hy - 22);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hx + 2, hy - 16);
    ctx.quadraticCurveTo(hx, hy - 28, hx + 6, hy - 24);
    ctx.stroke();

    // ── Udder glow (if not done) ──
    if (!done) {
      var pulse = 0.3 + Math.sin(Date.now()/400) * 0.15;
      ctx.strokeStyle = 'rgba(255,255,255,' + pulse + ')';
      ctx.lineWidth = 2; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(ux, uy + 4, 30, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      if (Math.sin(Date.now()/500) > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = 'bold 14px "Segoe UI",system-ui,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('+', ux, uy - 10);
      }
    }
  }

  function drawStage1() {
    var groundY = H * 0.78;
    // Nature background
    var grad = ctx.createLinearGradient(0, 0, 0, groundY);
    grad.addColorStop(0, '#7ec8e3'); grad.addColorStop(0.6, '#a8d8a0'); grad.addColorStop(1, '#7cb342');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, groundY);
    ctx.fillStyle = '#558b2f'; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(0, groundY - 4, W, 14);
    // Fence
    ctx.strokeStyle = '#6d4c00'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, groundY - 14); ctx.lineTo(W, groundY - 14); ctx.stroke();
    for (var fx = 30; fx < W; fx += 90) {
      ctx.fillStyle = '#8B6914'; ctx.fillRect(fx, groundY - 24, 5, 12);
    }
    // Sun + clouds
    var sunX = W * 0.8, sunY = H * 0.12;
    var sg = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 80);
    sg.addColorStop(0, 'rgba(255,250,220,0.7)'); sg.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = sg; ctx.fillRect(sunX - 90, sunY - 90, 180, 180);
    ctx.fillStyle = '#fff8dc';
    ctx.beginPath(); ctx.arc(sunX, sunY, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    for (var ci = 0; ci < 4; ci++) {
      var clx = (ci * 280 + Date.now()/40) % (W + 200) - 100;
      ctx.beginPath(); ctx.arc(clx, H*0.1 + ci*20, 24, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(clx+28, H*0.08 + ci*20, 20, 0, Math.PI*2); ctx.fill();
    }

    // Draw cows (skip delivered ones)
    for (var ci = 0; ci < sd.milkCows.length; ci++) {
      var cow = sd.milkCows[ci];
      if (cow.delivered) continue;
      var ccx = cow.x, ccy = cow.y + Math.sin(cow.bob + Date.now()/1000) * 2;
      cow.bob += 0.03;
      drawCowHolstein(ccx, ccy, cow.w, cow.h, groundY, cow.done);

      // Bucket position: use drag position if being dragged, else bucketDrag
      var bbx, bby;
      if (sd.bucketDragging && sd.draggingCowIdx === ci) {
        bbx = cow.bucketDragX - 22; bby = cow.bucketDragY;
      } else {
        bbx = cow.bucketDragX - 22; bby = cow.bucketDragY;
      }
      var bbw = 44, bbh = 28;
      var bucketCX = bbx + bbw/2;

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(bucketCX, bby + bbh + 2, bbw*0.45, 4, 0, 0, Math.PI*2); ctx.fill();

      // Bucket body
      ctx.fillStyle = cow.done ? '#bbb' : '#aaa';
      ctx.beginPath(); ctx.moveTo(bbx, bby); ctx.lineTo(bbx + bbw, bby);
      ctx.lineTo(bbx + bbw - 4, bby + bbh); ctx.lineTo(bbx + 4, bby + bbh);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = cow.done ? G : '#777'; ctx.lineWidth = cow.done ? 2.5 : 1.5;
      ctx.beginPath(); ctx.moveTo(bbx, bby); ctx.lineTo(bbx + bbw, bby);
      ctx.lineTo(bbx + bbw - 4, bby + bbh); ctx.lineTo(bbx + 4, bby + bbh);
      ctx.closePath(); ctx.stroke();
      // Handle
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bucketCX, bby - 3, bbw*0.3, Math.PI, 0); ctx.stroke();

      // Milk fill
      var fillPct = cow.milkAmount / sd.milkTarget;
      if (fillPct > 0) {
        ctx.fillStyle = 'rgba(255,255,250,0.85)';
        ctx.fillRect(bbx + 3, bby + bbh - 4 - (bbh-10)*fillPct, bbw - 6, (bbh-10)*fillPct);
      }
      // Done badge
      if (cow.done && !cow.delivered) {
        ctx.fillStyle = G;
        ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
        ctx.textAlign = 'center';
        if (!sd.bucketDragging && Math.sin(Date.now()/500) > 0) {
          ctx.fillText('DRAG ME', bucketCX, bby - 10);
        } else {
          ctx.fillText('READY', bucketCX, bby + bbh/2 + 5);
        }
      }
    }

    // Milk streams
    for (var si = sd.milkStreams.length - 1; si >= 0; si--) {
      var ms = sd.milkStreams[si];
      ms.life -= 0.02;
      if (ms.life <= 0) { sd.milkStreams.splice(si, 1); continue; }
      ctx.strokeStyle = 'rgba(255,255,250,' + (ms.life*2) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ms.x, ms.y + 6);
      ctx.lineTo(ms.bucketX, ms.bucketY + 2);
      ctx.stroke();
    }

    // Always show the facility
    drawMilkFacility();

    // Instructions
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.min(17, W*0.024) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    var doneCount = 0;
    for (var ci = 0; ci < sd.milkCows.length; ci++) { if (sd.milkCows[ci].done) doneCount++; }
    var remaining = 3 - sd.deliveredCount;
    if (sd.deliveredCount >= 3) {
      ctx.fillText('All buckets delivered!', W/2, H*0.12);
    } else if (doneCount < 3) {
      ctx.fillText('Click each cow to milk! Done: ' + doneCount + '/3', W/2, H*0.12);
    } else {
      ctx.fillText('All milked! Drag each bucket to facility --> (' + remaining + ' left)', W/2, H*0.12);
    }

    drawHUD(sd.deliveredCount >= 3 ? 'All 3 buckets delivered!' :
            doneCount < 3 ? 'Click udders to milk! ' + doneCount + '/3 done' :
            'DRAG each bucket to facility! ' + remaining + ' left');
  }

  function drawDraggableBucket2() {
    var ddx = sd.bucketDragX - 22, ddy = sd.bucketDragY;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(sd.bucketDragX, ddy + 20, 22, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#aaa';
    ctx.beginPath(); ctx.moveTo(ddx, ddy); ctx.lineTo(ddx + 44, ddy);
    ctx.lineTo(ddx + 40, ddy + 28); ctx.lineTo(ddx + 4, ddy + 28);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = G; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ddx, ddy); ctx.lineTo(ddx + 44, ddy);
    ctx.lineTo(ddx + 40, ddy + 28); ctx.lineTo(ddx + 4, ddy + 28);
    ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sd.bucketDragX, ddy - 3, 14, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,250,0.9)';
    ctx.fillRect(ddx + 3, ddy + 4, 38, 20);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('100%', sd.bucketDragX, ddy + 18);
    if (!sd.bucketDragging && Math.sin(Date.now()/500) > 0) {
      ctx.fillStyle = G;
      ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
      ctx.fillText('DRAG ME', sd.bucketDragX, ddy - 8);
    }
  }

  function drawMilkFacility() {
    var fx = sd.facilityX, fy = sd.facilityY;
    // Building
    ctx.fillStyle = '#7eb8da';
    ctx.fillRect(fx - 40, fy - 50, 80, 90);
    ctx.fillStyle = '#5a9ab5';
    ctx.fillRect(fx - 36, fy - 46, 72, 86);
    // Roof
    ctx.fillStyle = '#4a7a95';
    ctx.beginPath(); ctx.moveTo(fx - 48, fy - 50); ctx.lineTo(fx, fy - 70); ctx.lineTo(fx + 48, fy - 50); ctx.closePath(); ctx.fill();
    // Door
    ctx.fillStyle = '#3a5a6a';
    ctx.fillRect(fx - 12, fy + 10, 24, 30);
    // Sign
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('MILK', fx, fy - 20);
    ctx.fillText('FACILITY', fx, fy - 8);
    // Glow when dragging
    if (sd.bucketDragging) {
      var ga = 0.3 + Math.sin(Date.now()/300) * 0.15;
      ctx.strokeStyle = 'rgba(242,194,0,' + ga + ')';
      ctx.lineWidth = 3; ctx.setLineDash([5, 4]);
      ctx.strokeRect(fx - 44, fy - 54, 88, 98);
      ctx.setLineDash([]);
    }
  }

  function drawDraggableBucket(bx, by, bw, bh) {
    var ddx = sd.bucketDragX - bw/2, ddy = sd.bucketDragY - bh/2;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(sd.bucketDragX, sd.bucketDragY + bh/2 + 2, bw*0.5, 5, 0, 0, Math.PI*2); ctx.fill();
    // Bucket
    ctx.fillStyle = '#aaa';
    ctx.beginPath(); ctx.moveTo(ddx, ddy); ctx.lineTo(ddx + bw, ddy);
    ctx.lineTo(ddx + bw - 6, ddy + bh); ctx.lineTo(ddx + 6, ddy + bh);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = G; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ddx, ddy); ctx.lineTo(ddx + bw, ddy);
    ctx.lineTo(ddx + bw - 6, ddy + bh); ctx.lineTo(ddx + 6, ddy + bh);
    ctx.closePath(); ctx.stroke();
    // Handle
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sd.bucketDragX, ddy - 4, bw*0.32, Math.PI, 0); ctx.stroke();
    // Full milk
    ctx.fillStyle = 'rgba(255,255,250,0.95)';
    ctx.fillRect(ddx + 5, ddy + 6, bw - 10, bh - 12);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('100%', sd.bucketDragX, ddy + bh/2 + 4);
    // Grab hint
    if (!sd.bucketDragging && Math.sin(Date.now()/500) > 0) {
      ctx.fillStyle = G;
      ctx.font = 'bold 13px "Segoe UI",system-ui,sans-serif';
      ctx.fillText('DRAG ME', sd.bucketDragX, ddy - 12);
    }
  }

  function drawStage3() {
    var groundY = H * 0.78;
    // Milk-white background
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#fefefe'); grad.addColorStop(0.5, '#fafaf7'); grad.addColorStop(1, '#f5f2ed');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    // ─── Header bar ───
    var hdrY = 6, hdrH = 42;
    ctx.fillStyle = 'rgba(19,75,141,0.1)';
    rrect(10, hdrY, W - 20, hdrH, 10); ctx.fill();
    ctx.fillStyle = N;
    ctx.font = 'bold ' + Math.min(16, W*0.022) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('COOL THE MILK: Catch blue stars (+100) — Dodge yellow stars (-200)', W/2, hdrY + 28);

    // ─── Score progress bar ───
    var tp = Math.min(1, stageScores[stage] / 1000);
    var pbx = W * 0.1, pby = H * 0.1, pbw = W * 0.8, pbh = 14;
    // Background
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    rrect(pbx - 2, pby - 2, pbw + 4, pbh + 4, 8); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.04)';
    rrect(pbx, pby, pbw, pbh, 6); ctx.fill();
    // Fill
    var barGrad = ctx.createLinearGradient(pbx, 0, pbx + pbw, 0);
    barGrad.addColorStop(0, '#3b82f6'); barGrad.addColorStop(0.4, '#38bdf8'); barGrad.addColorStop(1, '#22c55e');
    ctx.fillStyle = barGrad;
    rrect(pbx, pby, pbw * tp, pbh, 6); ctx.fill();
    // Score text on bar
    ctx.fillStyle = '#333';
    ctx.font = 'bold 13px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(stageScores[stage] + ' / 1000', W/2, pby - 6);
    // Target mark
    ctx.strokeStyle = N; ctx.lineWidth = 2;
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(pbx + pbw, pby - 6); ctx.lineTo(pbx + pbw, pby + pbh + 6); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = N;
    ctx.font = 'bold 9px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('GOAL', pbx + pbw, pby - 12);

    // ─── Ground ───
    ctx.fillStyle = '#e8e0d5';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#d4c8b8';
    ctx.fillRect(0, groundY, W, 3);

    // ─── Falling stars ───
    for (var i = 0; i < sd.iceBlocks.length; i++) {
      var b = sd.iceBlocks[i];
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);

      if (b.type === 'ice') {
        // Blue star
        var sz = b.r;
        drawStar(0, 0, sz, sz*0.45, 5, '#3b82f6', '#60a5fa');
        // Sparkle
        var sparkA = 0.4 + Math.sin(b.sparkle) * 0.3;
        ctx.fillStyle = 'rgba(255,255,255,' + sparkA + ')';
        ctx.beginPath(); ctx.arc(0, -sz*0.1, sz*0.15, 0, Math.PI*2); ctx.fill();
        // +100 label
        ctx.fillStyle = '#3b82f6';
        ctx.font = 'bold 10px \"Segoe UI\",system-ui,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('+100', 0, sz + 14);
      } else {
        // Yellow danger star
        var sz = b.r;
        drawStar(0, 0, sz, sz*0.45, 5, '#f59e0b', '#fbbf24');
        // Warning glow
        var warnA = 0.3 + Math.sin(b.sparkle*2) * 0.2;
        ctx.strokeStyle = 'rgba(245,158,11,' + warnA + ')';
        ctx.lineWidth = 2; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(0, 0, sz*1.2, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
        // -200 label
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 10px \"Segoe UI\",system-ui,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('-200', 0, sz + 14);
      }
      ctx.restore();
    }

    // ─── Player bucket ───
    var bx = sd.bucketX, by = groundY - 14;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath(); ctx.ellipse(bx, by + 16, 28, 5, 0, 0, Math.PI*2); ctx.fill();
    // Bucket body
    ctx.fillStyle = '#667788';
    ctx.beginPath(); ctx.moveTo(bx-28, by-14); ctx.lineTo(bx+28, by-14);
    ctx.lineTo(bx+20, by+14); ctx.lineTo(bx-20, by+14);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#445566'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx-28, by-14); ctx.lineTo(bx+28, by-14);
    ctx.lineTo(bx+20, by+14); ctx.lineTo(bx-20, by+14);
    ctx.closePath(); ctx.stroke();
    // Handle
    ctx.strokeStyle = '#8899aa'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bx, by-18, 16, Math.PI, 0); ctx.stroke();
    // Catch zone glow
    ctx.strokeStyle = 'rgba(59,130,246,0.25)';
    ctx.lineWidth = 2; ctx.setLineDash([3, 5]);
    ctx.beginPath(); ctx.arc(bx, by, 42, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);

    // ─── Splash particles ───
    for (var i = 0; i < sd.iceParticles.length; i++) {
      var p = sd.iceParticles[i];
      var alpha = p.life * 1.6;
      if (p.color === '#3b82f6') {
        ctx.fillStyle = 'rgba(59,130,246,' + alpha + ')';
      } else {
        ctx.fillStyle = 'rgba(245,158,11,' + alpha + ')';
      }
      ctx.beginPath(); ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI*2); ctx.fill();
    }

    // ─── Info panel ───
    var needed = Math.max(0, 1000 - stageScores[stage]);
    ctx.fillStyle = 'rgba(0,0,0,0.04)';
    rrect(W * 0.35, H * 0.93, W * 0.3, 36, 8); ctx.fill();
    ctx.fillStyle = N;
    ctx.font = 'bold ' + Math.min(14, W*0.02) + 'px \"Segoe UI\",system-ui,sans-serif';
    ctx.textAlign = 'center';
    if (stageScores[stage] >= 1000) {
      ctx.fillText('1000 POINTS REACHED!', W/2, H*0.96);
    } else {
      ctx.fillText('Need ' + needed + ' more points!  Blue = +100  |  Yellow = -200', W/2, H*0.96);
    }

    drawHUD('Catch BLUE stars (+100)! Avoid YELLOW (-200) | ' + stageScores[stage] + ' / 1000');
  }

  // Star drawing helper
  function drawStar(cx, cy, outerR, innerR, points, fill, stroke) {
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke; ctx.lineWidth = 2;
    ctx.beginPath();
    for (var i = 0; i < points * 2; i++) {
      var r = i % 2 === 0 ? outerR : innerR;
      var angle = i * Math.PI / points - Math.PI / 2;
      var sx = cx + Math.cos(angle) * r;
      var sy = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  function drawStage2() {
    // Industrial pasteurization room
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a1008'); grad.addColorStop(0.5, '#2a1a0e'); grad.addColorStop(1, '#150a04');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    // ─── Header panel ───
    var hdrY = 8, hdrH = 48;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    rrect(10, hdrY, W - 20, hdrH, 10); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.min(16, W*0.022) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PASTEURIZATION: Hold to HEAT — Release to COOL — Stay in the GREEN zone!', W/2, hdrY + 20);
    ctx.fillStyle = '#f97316';
    ctx.font = 'bold ' + Math.min(12, W*0.017) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('Sweet zone: 68-78C  |  Hold mouse/touch or SPACE to heat', W/2, hdrY + 38);

    var tcx = sd.tankCX, tcy = sd.tankCY, tr = sd.tankR;

    // ─── Tank glow (temperature-dependent) ───
    var glowAlpha = sd.heating ? 0.25 + (sd.pasteurTemp / 100) * 0.35 : 0.05;
    var glowCol = sd.pasteurTemp > 78 ? 'rgba(255,100,30,' + glowAlpha + ')' :
                  sd.pasteurTemp < 68 ? 'rgba(100,180,255,' + glowAlpha + ')' :
                  'rgba(100,255,150,' + glowAlpha + ')';
    var glowGrad = ctx.createRadialGradient(tcx, tcy, tr * 0.6, tcx, tcy, tr * 1.4);
    glowGrad.addColorStop(0, glowCol);
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath(); ctx.arc(tcx, tcy, tr * 1.4, 0, Math.PI * 2); ctx.fill();

    // ─── Outer steel tank ───
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath(); ctx.arc(tcx, tcy, tr + 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(tcx, tcy, tr + 10, 0, Math.PI * 2); ctx.stroke();
    // Inner rim
    ctx.strokeStyle = '#777'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(tcx, tcy, tr, 0, Math.PI * 2); ctx.stroke();

    // ─── Milk fill (color by temperature) ───
    var milkR, milkG, milkB;
    if (sd.pasteurTemp < 40) { milkR = 180; milkG = 210; milkB = 255; }      // Cold: icy blue
    else if (sd.pasteurTemp < 60) { milkR = 220; milkG = 230; milkB = 250; } // Warming: pale blue
    else if (sd.pasteurTemp < 68) { milkR = 250; milkG = 248; milkB = 240; } // Almost: cream
    else if (sd.pasteurTemp <= 78) { milkR = 255; milkG = 255; milkB = 252; } // Perfect: bright white
    else if (sd.pasteurTemp < 85) { milkR = 255; milkG = 245; milkB = 220; }  // Hot: warm cream
    else { milkR = 255; milkG = 200; milkB = 120; }                           // Burning: orange
    var milkAlpha = 0.7 + (sd.pasteurTemp / 100) * 0.3;
    ctx.fillStyle = 'rgba(' + milkR + ',' + milkG + ',' + milkB + ',' + milkAlpha + ')';
    ctx.beginPath(); ctx.arc(tcx, tcy, tr - 2, 0, Math.PI * 2); ctx.fill();

    // ─── Surface shimmer ───
    var shimmerY = tcy - tr * 0.2;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.ellipse(tcx, shimmerY, tr * 0.8, tr * 0.12, 0, 0, Math.PI * 2); ctx.fill();

    // ─── Temperature ring around tank ───
    var ringW = 6;
    // Background arc
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = ringW;
    ctx.beginPath(); ctx.arc(tcx, tcy, tr + 18, -Math.PI * 0.75, Math.PI * 0.25); ctx.stroke();
    // Cold zone (blue)
    ctx.strokeStyle = sd.pasteurTemp < 40 ? '#3b82f6' : 'rgba(59,130,246,0.3)'; ctx.lineWidth = ringW;
    ctx.beginPath(); ctx.arc(tcx, tcy, tr + 18, -Math.PI * 0.75, -Math.PI * 0.45); ctx.stroke();
    // Warm zone (yellow)
    ctx.strokeStyle = sd.pasteurTemp >= 40 && sd.pasteurTemp < 68 ? '#f59e0b' : 'rgba(245,158,11,0.3)';
    ctx.beginPath(); ctx.arc(tcx, tcy, tr + 18, -Math.PI * 0.45, -Math.PI * 0.15); ctx.stroke();
    // Sweet zone (green)
    ctx.strokeStyle = sd.pasteurTemp >= 68 && sd.pasteurTemp <= 78 ? '#22c55e' : 'rgba(34,197,94,0.3)';
    ctx.lineWidth = ringW;
    ctx.beginPath(); ctx.arc(tcx, tcy, tr + 18, -Math.PI * 0.15, Math.PI * 0.15); ctx.stroke();
    // Hot zone (orange)
    ctx.strokeStyle = sd.pasteurTemp > 78 && sd.pasteurTemp <= 88 ? '#f97316' : 'rgba(249,115,22,0.3)';
    ctx.beginPath(); ctx.arc(tcx, tcy, tr + 18, Math.PI * 0.15, Math.PI * 0.25); ctx.stroke();

    // ─── Needle indicator on the ring ───
    var needleAngle = -Math.PI * 0.75 + (sd.pasteurTemp / 95) * Math.PI;
    var nx = tcx + Math.cos(needleAngle) * (tr + 18);
    var ny = tcy + Math.sin(needleAngle) * (tr + 18);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(nx, ny, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tcx + Math.cos(needleAngle) * (tr + 6), tcy + Math.sin(needleAngle) * (tr + 6));
    ctx.lineTo(nx, ny);
    ctx.stroke();

    // ─── Tank label ───
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.font = 'bold 14px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('MILK', tcx, tcy + 5);

    // ─── Bubbles ───
    for (var i = 0; i < sd.bubbles.length; i++) {
      var b = sd.bubbles[i];
      var ba = b.life / 1.0;
      if (b.steam) {
        ctx.fillStyle = 'rgba(200,200,210,' + (ba * 0.4) + ')';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.5, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,' + (ba * 0.7) + ')';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,' + (ba * 0.2) + ')';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 1, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ─── Left panel: Temperature display ───
    var panelX = W * 0.02, panelY = H * 0.15, panelW = W * 0.13, panelH = H * 0.28;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    rrect(panelX, panelY, panelW, panelH, 12); ctx.fill();

    ctx.fillStyle = '#999';
    ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('TEMP', panelX + panelW/2, panelY + 22);

    var tCol = sd.pasteurTemp > 85 ? '#ef4444' : sd.pasteurTemp < 35 ? '#3b82f6' :
               sd.pasteurTemp >= 68 && sd.pasteurTemp <= 78 ? '#22c55e' : '#f59e0b';
    ctx.fillStyle = tCol;
    ctx.font = 'bold ' + Math.min(50, W*0.065) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(Math.round(sd.pasteurTemp) + 'C', panelX + panelW/2, panelY + 75);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('Target: 68-78C', panelX + panelW/2, panelY + 98);

    // Status badge
    var statusText = sd.pasteurTemp > 85 ? 'BURNING!' : sd.pasteurTemp < 35 ? 'FREEZING!' :
                     sd.pasteurTemp >= 68 && sd.pasteurTemp <= 78 ? 'PERFECT' : 'ADJUST';
    var statusCol = statusText === 'PERFECT' ? '#22c55e' : statusText === 'ADJUST' ? '#f59e0b' :
                    statusText === 'FREEZING!' ? '#3b82f6' : '#ef4444';
    ctx.fillStyle = statusCol;
    ctx.font = 'bold 13px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(statusText, panelX + panelW/2, panelY + 120);

    // ─── Vertical thermometer bar ───
    var thermoX = panelX + panelW + 14, thermoY = panelY + 30, thermoW = 14, thermoH = panelH - 40;
    // Glass tube
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    rrect(thermoX - 2, thermoY - 2, thermoW + 4, thermoH + 4, 7); ctx.fill();
    // Background
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    rrect(thermoX, thermoY, thermoW, thermoH, 6); ctx.fill();
    // Fill level
    var fillH = (sd.pasteurTemp / 95) * thermoH;
    var fillCol;
    if (sd.pasteurTemp < 35) fillCol = '#3b82f6';
    else if (sd.pasteurTemp < 68) fillCol = '#f59e0b';
    else if (sd.pasteurTemp <= 78) fillCol = '#22c55e';
    else if (sd.pasteurTemp <= 88) fillCol = '#f97316';
    else fillCol = '#ef4444';
    ctx.fillStyle = fillCol;
    rrect(thermoX + 1, thermoY + thermoH - fillH, thermoW - 2, fillH, 5); ctx.fill();
    // Sweet zone markers on thermo
    var szTop = thermoY + thermoH - (78 / 95) * thermoH;
    var szBot = thermoY + thermoH - (68 / 95) * thermoH;
    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(thermoX - 4, szTop); ctx.lineTo(thermoX + thermoW + 4, szTop); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(thermoX - 4, szBot); ctx.lineTo(thermoX + thermoW + 4, szBot); ctx.stroke();

    // ─── Flame indicator (when heating) ───
    if (sd.heating) {
      var flameX = tcx, flameY = tcy + tr + 20;
      var fAlpha = 0.5 + Math.sin(Date.now()/150) * 0.3;
      ctx.fillStyle = 'rgba(255,120,20,' + fAlpha + ')';
      ctx.beginPath();
      ctx.moveTo(flameX, flameY + 30);
      ctx.quadraticCurveTo(flameX - 18, flameY, flameX, flameY - 14);
      ctx.quadraticCurveTo(flameX + 18, flameY, flameX, flameY + 30);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,200,50,' + (fAlpha * 0.7) + ')';
      ctx.beginPath();
      ctx.moveTo(flameX, flameY + 26);
      ctx.quadraticCurveTo(flameX - 10, flameY + 6, flameX, flameY - 6);
      ctx.quadraticCurveTo(flameX + 10, flameY + 6, flameX, flameY + 26);
      ctx.fill();
    }

    // ─── Progress bar (bottom) ───
    var tp = sd.zoneTime / sd.zoneTarget;
    var pbx = W * 0.1, pby = H * 0.9, pbw = W * 0.8, pbh = 10;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    rrect(pbx - 4, pby - 4, pbw + 8, pbh + 16, 8); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    rrect(pbx, pby, pbw, pbh, 5); ctx.fill();
    var barCol = tp > 0.7 ? '#22c55e' : '#f97316';
    ctx.fillStyle = barCol;
    rrect(pbx, pby, pbw * Math.min(1, tp), pbh, 5); ctx.fill();
    // Progress label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('TIME IN SWEET ZONE: ' + Math.floor(tp*100) + '%', W/2, pby + pbh + 18);

    // ─── Instructions ───
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = 'bold ' + Math.min(14, W*0.02) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    var heatText = sd.heating ? 'HEATING... RELEASE to cool!' : 'HOLD CLICK / SPACE to heat the milk!';
    ctx.fillText(heatText + '  |  Stay in green zone (68-78C)', W/2, H*0.97);

    drawHUD('HOLD to heat! Stay 68-78C | Zone time: ' + sd.zoneTime.toFixed(1) + 's / ' + sd.zoneTarget + 's');
  }

  function drawStage4() {
    // Packing room
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#e8e0d8'); grad.addColorStop(0.5, '#d8d0c8'); grad.addColorStop(1, '#c8c0b8');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    // Floor line
    ctx.fillStyle = '#bbb'; ctx.fillRect(0, H*0.72, W, 4);

    // ─── Counter (left) ───
    var ctrX = sd.counterX - 40, ctrY = sd.counterY, ctrW = 420, ctrH = 16;
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(ctrX, ctrY, ctrW, ctrH);
    ctx.fillStyle = '#a08060';
    ctx.fillRect(ctrX, ctrY, ctrW, 4);
    // Counter legs
    ctx.fillStyle = '#6B5335';
    ctx.fillRect(ctrX + 30, ctrY + ctrH, 10, H*0.72 - ctrY - ctrH);
    ctx.fillRect(ctrX + ctrW - 40, ctrY + ctrH, 10, H*0.72 - ctrY - ctrH);
    // Shelf label
    ctx.fillStyle = '#555';
    ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Fresh Milk Bottles', ctrX + 10, ctrY - 8);

    // ─── Milk bottles on counter ───
    for (var i = 0; i < sd.packBottles.length; i++) {
      var b = sd.packBottles[i];
      if (b.packed) continue;
      var bx = b.x, by = b.y;
      // Bottle body
      ctx.fillStyle = 'rgba(255,255,252,0.9)';
      ctx.fillRect(bx - 12, by - 36, 24, 38);
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1.5;
      ctx.strokeRect(bx - 12, by - 36, 24, 38);
      // Neck
      ctx.fillStyle = 'rgba(255,255,252,0.85)';
      ctx.fillRect(bx - 5, by - 46, 10, 12);
      ctx.strokeRect(bx - 5, by - 46, 10, 12);
      // Cap
      ctx.fillStyle = N;
      ctx.fillRect(bx - 6, by - 50, 12, 6);
      // Milk fill
      ctx.fillStyle = 'rgba(255,255,250,0.6)';
      ctx.fillRect(bx - 9, by - 10, 18, 12);
      // Grab highlight
      if (b.grabbed) {
        ctx.strokeStyle = G; ctx.lineWidth = 2;
        ctx.setLineDash([3, 3]);
        ctx.strokeRect(bx - 14, by - 52, 28, 54);
        ctx.setLineDash([]);
      }
    }

    // ─── Crate (right) ───
    var crX = sd.crateCX - 75, crY = sd.crateCY - 35, crW = 150, crH = 80;
    // Crate body
    ctx.fillStyle = '#c49a3c';
    ctx.fillRect(crX, crY, crW, crH);
    ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 3;
    ctx.strokeRect(crX, crY, crW, crH);
    // Slats
    ctx.strokeStyle = '#a07820'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(crX, crY + crH*0.33); ctx.lineTo(crX + crW, crY + crH*0.33); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(crX, crY + crH*0.66); ctx.lineTo(crX + crW, crY + crH*0.66); ctx.stroke();
    // Crate label
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('VITA DAIRY', crX + crW/2, crY - 8);
    // Target glow when holding bottle
    if (sd.grabbedIdx >= 0) {
      var glowA = 0.3 + Math.sin(Date.now()/300) * 0.15;
      ctx.strokeStyle = 'rgba(242,194,0,' + glowA + ')';
      ctx.lineWidth = 3; ctx.setLineDash([5, 4]);
      ctx.strokeRect(crX - 4, crY - 4, crW + 8, crH + 8);
      ctx.setLineDash([]);
    }

    // ─── Packed bottles in crate ───
    for (var i = 0; i < sd.packBottles.length; i++) {
      var b = sd.packBottles[i];
      if (!b.packed) continue;
      var bx = b.x, by = b.y;
      ctx.fillStyle = 'rgba(255,255,252,0.9)';
      ctx.fillRect(bx - 8, by - 24, 16, 26);
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
      ctx.strokeRect(bx - 8, by - 24, 16, 26);
      ctx.fillStyle = N;
      ctx.fillRect(bx - 4, by - 30, 8, 4);
      ctx.fillStyle = 'rgba(255,255,250,0.5)';
      ctx.fillRect(bx - 5, by - 4, 10, 6);
    }

    // ─── Counter ───
    ctx.fillStyle = '#000';
    ctx.font = 'bold ' + Math.min(22, W*0.03) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Packed: ' + sd.packedCount + ' / ' + sd.packTarget, W/2, H*0.82);

    // Instructions
    ctx.fillStyle = '#333';
    ctx.font = 'bold ' + Math.min(15, W*0.022) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    var instr = sd.grabbedIdx >= 0 ? 'Now click the CRATE to drop it in!' : 'Click a bottle to grab it!';
    ctx.fillText(instr, W/2, H*0.12);

    drawHUD('Click bottles then click crate to pack! ' + sd.packedCount + '/' + sd.packTarget);
  }

  function drawHUD(text) {
    // Stage indicator
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    rrect(8, 8, 180, 24, 12); ctx.fill();
    ctx.fillStyle = STAGES[stage].color;
    ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('STAGE ' + (stage+1) + ': ' + STAGES[stage].name, 16, 25);

    // Score
    if (stageScores[stage] > 0) {
      ctx.fillStyle = G;
      ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(stageScores[stage] + ' pts', W - 12, 25);
    }

    // Help text at bottom
    if (text) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      var tw = ctx.measureText(text).width + 40;
      rrect(W/2 - tw/2, H - 34, tw, 24, 12); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '11px "Segoe UI",system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, W/2, H - 18);
    }
  }

  function drawBasePlay() {
    if (stage === 0) drawStage0();
    else if (stage === 1) drawStage1();
    else if (stage === 2) drawStage2();
    else if (stage === 3) drawStage3();
    else if (stage === 4) drawStage4();
  }

  // ─── Main Loop ───
  var lastTime = null;
  function loop(timestamp) {
    if (lastTime === null) lastTime = timestamp;
    var dt = Math.min(0.1, (timestamp - lastTime) / 1000);
    lastTime = timestamp;

    ctx.clearRect(0, 0, W, H);

    if (gs === STATE.MENU) {
      drawMenu();
    } else if (gs === STATE.INTRO) {
      drawStageIntro();
      update(dt);
    } else if (gs === STATE.PLAYING) {
      update(dt);
      drawBasePlay();
    } else if (gs === STATE.STAGE_CLEAR) {
      drawBasePlay();
      drawStageClear();
      if (clearTimer === 0) { clearTimer = 0.001; }
      clearTimer += dt;
    } else if (gs === STATE.FINAL) {
      drawFinal();
    }

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
