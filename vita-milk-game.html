<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vita: Farm to Fridge</title>
<style>
  :root { --gold: #F2C200; --navy: #134B8D; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif;
    width:100vw; height:100vh; user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  canvas { display:block; position:fixed; top:0; left:0; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  "use strict";
  var c = document.getElementById('c');
  var ctx = c.getContext('2d');
  var G = '#F2C200';
  var N = '#134B8D';
  var W, H;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    c.width = W;
    c.height = H;
  }
  window.addEventListener('resize', resize);
  resize();

  // ─── Game State ───
  var STATE = { MENU:0, INTRO:1, PLAYING:2, STAGE_CLEAR:3, FINAL:4 };
  var gs = STATE.MENU;
  var stage = 0;
  var totalScore = 0;
  var bestScore = 0;
  try { bestScore = parseInt(localStorage.getItem('vita-farmtofridge-best') || '0'); } catch(e) {}

  var stageScores = [0, 0, 0, 0, 0];
  var introTimer = 0;
  var clearTimer = 0;
  var clickX = 0, clickY = 0;
  var mouseDown = false;
  var touchActive = false;
  var keys = {};

  // ─── Stage config ───
  var STAGES = [
    { name:'Feed the Cows', icon:'F', color:'#4ade80',
      desc:'Cows graze on fresh Kosovo pastures. Feed each cow to prepare them for milking!',
      fact:'A dairy cow eats about 25 kg of grass and hay every day to produce rich, nutritious milk.' },
    { name:'Milking Time', icon:'M', color:'#60a5fa',
      desc:'Click the cow\'s udder to milk her! Each click fills the bucket. Fill it to 100% to complete!',
      fact:'Cows are milked 2-3 times daily. Modern machines gently extract milk in just 5-7 minutes per cow.' },
    { name:'Cool the Milk', icon:'C', color:'#38bdf8',
      desc:'Catch falling ice blocks with your bucket to cool the milk! Dodge the red heat blocks — they make it too warm!',
      fact:'Milk leaves the cow at 37C and must be cooled to 4C within 2 hours to stay fresh and safe.' },
    { name:'Pasteurization', icon:'P', color:'#f97316',
      desc:'Click inside the milk tank to create heat bursts and zap bacteria! Keep the temperature at 72C for perfect pasteurization.',
      fact:'Vita pasteurizes milk by heating it to 72C for 15 seconds, then rapidly cooling it. This kills harmful bacteria while preserving nutrients.' },
    { name:'Bottle & Deliver', icon:'B', color:'#a78bfa',
      desc:'Grab milk bottles from the counter and pack them into the Vita crate! Click a bottle then click the crate to drop it in.',
      fact:'After pasteurization, milk is bottled, sealed, and delivered to stores within 24 hours - farm fresh to your table!' }
  ];

  // ─── Stage-Specific Data ───
  var sd = {};

  function resetStageData(n) {
    sd = {};
    sd.cows = [];
    sd.wheats = []; sd.grabbedWheat = null; sd.wheatOffX = 0; sd.wheatOffY = 0;
    sd.fedCount = 0; sd.cowTarget = 3;
    sd.milkAmount = 0; sd.milkTarget = 100; sd.udderCX = 0; sd.udderCY = 0; sd.udderCooldown = 0;
    sd.milkStreams = []; sd.bucketReady = false; sd.bucketDragX = 0; sd.bucketDragY = 0;
    sd.facilityX = 0; sd.facilityY = 0; sd.bucketDragging = false; sd.allDone = false;
    sd.temp = 4.0; sd.tempTime = 0; sd.tempTarget = 20;
    sd.bucketX = 0; sd.iceBlocks = []; sd.iceParticles = []; sd.iceSpawnTimer = 0;
    sd.playerX = 0; sd.playerY = 0; sd.playerVY = 0; sd.bacteria = [];
    sd.heatRings = []; sd.bactSpawnTimer = 0; sd.pasteurTemp = 72; sd.pasteurTime = 0; sd.pasteurTarget = 18;
    sd.packBottles = []; sd.packSpawnTimer = 0; sd.packedCount = 0; sd.packTarget = 12;
    sd.grabbedIdx = -1; sd.counterX = 0; sd.counterY = 0; sd.crateCX = 0; sd.crateCY = 0;
    sd.beltY = 0;
    sd.stars = 0;

    // Stage 1
    if (n === 0) {
      var cowW = Math.min(90, W * 0.095), cowH = Math.min(70, W * 0.075);
      var groundY = H * 0.78;
      // Spawn 5 random wheat pieces on the ground
      for (var w = 0; w < 5; w++) {
        sd.wheats.push({
          x: W * 0.1 + Math.random() * W * 0.6,
          y: groundY - 20 - Math.random() * 14,
          active: true
        });
      }
      var spacing = (W - 60) / sd.cowTarget;
      for (var i = 0; i < sd.cowTarget; i++) {
        sd.cows.push({
          x: 30 + spacing * (i + 0.5) - cowW / 2,
          y: groundY - cowH,
          w: cowW, h: cowH,
          feed: 0, need: 3, happy: 0, vx: 0, vy: 0,
          dir: 1, bob: Math.random() * Math.PI * 2
        });
      }
    }
    // Stage 2
    if (n === 1) {
      sd.facilityX = W * 0.85; sd.facilityY = H * 0.5;
      sd.milkCows = [];
      var groundY2 = H * 0.78;
      var cowW2 = 120, cowH2 = 80;
      var totalW = cowW2 * 3 + 40;
      var startX = (W - totalW) / 2;
      for (var ci = 0; ci < 3; ci++) {
        var ccx = startX + ci * (cowW2 + 20);
        sd.milkCows.push({
          x: ccx, y: groundY2 - cowH2,
          w: cowW2, h: cowH2,
          udderCX: ccx + cowW2 * 0.48,
          udderCY: groundY2 - cowH2 + cowH2 - 4 + 8,
          milkAmount: 0, done: false,
          bucketX: ccx + cowW2 * 0.48,
          bucketY: groundY2 + 4,
          bob: Math.random() * Math.PI * 2
        });
      }
    }
    // Stage 3
    if (n === 2) {
      sd.temp = 4.0; sd.bucketX = W/2; sd.iceBlocks = []; sd.iceParticles = []; sd.iceSpawnTimer = 0;
    }
    // Stage 4
    if (n === 3) {
      sd.tankCX = W * 0.5; sd.tankCY = H * 0.45; sd.tankR = Math.min(W, H) * 0.32;
    }
    // Stage 5
    if (n === 4) {
      sd.counterX = W * 0.18; sd.counterY = H * 0.45;
      sd.crateCX = W * 0.72; sd.crateCY = H * 0.50;
    }
  }

  // ─── Input ───
  c.addEventListener('mousedown', function(e) { e.preventDefault(); mouseDown = true;
    var r = c.getBoundingClientRect();
    clickX = e.clientX - r.left; clickY = e.clientY - r.top;
    if (gs === STATE.MENU) handleMenuClick(clickX, clickY);
    else if (gs === STATE.STAGE_CLEAR) handleClearClick();
    else if (gs === STATE.FINAL) handleFinalClick(clickX, clickY);
    else if (gs === STATE.PLAYING && stage === 0) handleStage0Down(clickX, clickY);
  });
  c.addEventListener('mouseup', function() { mouseDown = false; sd.grabbedWheat = null; });
  c.addEventListener('mousemove', function(e) { 
    var r = c.getBoundingClientRect();
    clickX = e.clientX - r.left; clickY = e.clientY - r.top;
    if (gs === STATE.PLAYING && stage === 0 && sd.grabbedWheat) { sd.grabbedWheat.x = clickX - sd.wheatOffX; sd.grabbedWheat.y = clickY - sd.wheatOffY; }
  });
  c.addEventListener('click', function(e) {
    if (gs === STATE.PLAYING) {
      var r = c.getBoundingClientRect();
      var cx = e.clientX - r.left, cy = e.clientY - r.top;
      if (stage === 1) tryMilk(cx, cy);
      if (stage === 3) handlePasteurClick(cx, cy);
      if (stage === 4) handlePackClick(cx, cy);
    }
  });
  c.addEventListener('touchstart', function(e) { e.preventDefault(); touchActive = true;
    var t = e.touches[0];
    var r = c.getBoundingClientRect();
    clickX = t.clientX - r.left; clickY = t.clientY - r.top;
    if (gs === STATE.MENU) handleMenuClick(clickX, clickY);
    else if (gs === STATE.STAGE_CLEAR) handleClearClick();
    else if (gs === STATE.FINAL) handleFinalClick(clickX, clickY);
    else if (gs === STATE.PLAYING && stage === 0) handleStage0Down(clickX, clickY);
    if (gs === STATE.PLAYING && stage === 1) tryMilk(clickX, clickY);
    if (gs === STATE.PLAYING && stage === 3) handlePasteurClick(clickX, clickY);
    if (gs === STATE.PLAYING && stage === 4) handlePackClick(clickX, clickY);
  });
  c.addEventListener('touchmove', function(e) { e.preventDefault();
    var t = e.touches[0];
    var r = c.getBoundingClientRect();
    clickX = t.clientX - r.left; clickY = t.clientY - r.top;
    if (gs === STATE.PLAYING && stage === 0 && sd.grabbedWheat) { sd.grabbedWheat.x = clickX - sd.wheatOffX; sd.grabbedWheat.y = clickY - sd.wheatOffY; }
  });
  c.addEventListener('touchend', function() { touchActive = false; sd.grabbedWheat = null; });
  window.addEventListener('keydown', function(e) { keys[e.key.toLowerCase()] = true;
    if (e.key === ' ' || e.key === 'ArrowUp') e.preventDefault();
  });
  window.addEventListener('keyup', function(e) { keys[e.key.toLowerCase()] = false; });

  function handleMenuClick(mx, my) {
    stage = 0; totalScore = 0; stageScores = [0,0,0,0,0];
    resetStageData(0);
    gs = STATE.INTRO; introTimer = 0;
  }
  function handleClearClick() { advanceStage(); }
  function handleFinalClick(mx, my) {
    stage = 0; totalScore = 0; stageScores = [0,0,0,0,0];
    resetStageData(0);
    gs = STATE.INTRO; introTimer = 0;
  }
  function handleStage0Down(mx, my) {
    // Find closest active wheat
    var closest = null, closestDist = 45;
    for (var w = 0; w < sd.wheats.length; w++) {
      var wh = sd.wheats[w];
      if (!wh.active) continue;
      var dx = mx - wh.x, dy = my - wh.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < closestDist) { closest = wh; closestDist = dist; }
    }
    if (closest) {
      sd.grabbedWheat = closest;
      sd.wheatOffX = mx - closest.x;
      sd.wheatOffY = my - closest.y;
    }
  }

  function advanceStage() {
    stage++;
    if (stage >= 5) { gs = STATE.FINAL; return; }
    resetStageData(stage);
    gs = STATE.INTRO; introTimer = 0;
  }

  function finishStage() {
    sd.stars = stageScores[stage] >= 80 ? 3 : stageScores[stage] >= 50 ? 2 : 1;
    totalScore += stageScores[stage];
    gs = STATE.STAGE_CLEAR; clearTimer = 0;
    if (stage === 4 && totalScore > bestScore) {
      bestScore = totalScore;
      try { localStorage.setItem('vita-farmtofridge-best', bestScore); } catch(e) {}
    }
  }

  // ─── Update ───
  function update(dt) {
    if (gs === STATE.INTRO) { introTimer += dt; if (introTimer > 2.5) { gs = STATE.PLAYING; introTimer = 0; } return; }
    if (gs === STATE.STAGE_CLEAR) { clearTimer += dt; return; }
    if (gs !== STATE.PLAYING) return;

    if (stage === 0) updateStage0(dt);
    else if (stage === 1) updateStage1(dt);
    else if (stage === 2) updateStage2(dt);
    else if (stage === 3) updateStage3(dt);
    else if (stage === 4) updateStage4(dt);
  }

  // Stage 0: Feed cows
  function updateStage0(dt) {
    var groundY = H * 0.78;
    for (var i = 0; i < sd.cows.length; i++) {
      var cow = sd.cows[i];
      cow.bob += dt * 2;
      if (cow.feed >= cow.need) continue;

      for (var w = sd.wheats.length - 1; w >= 0; w--) {
        var wh = sd.wheats[w];
        if (!wh.active) continue;
        if (wh === sd.grabbedWheat) continue; // being dragged
        var dx = wh.x - (cow.x + cow.w / 2);
        var dy = wh.y - (cow.y + cow.h / 2);
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 50) {
          cow.feed++;
          cow.happy = 0.8;
          wh.active = false; // wheat eaten, disappears
          if (cow.feed >= cow.need) { sd.fedCount++; stageScores[stage] += 15; }
          // Spawn new wheat elsewhere
          spawnWheat(groundY);
        }
      }
      if (cow.happy > 0) cow.happy = Math.max(0, cow.happy - dt);
    }
    // Ensure at least 4 active wheats
    var activeCount = 0;
    for (var w = 0; w < sd.wheats.length; w++) {
      if (sd.wheats[w].active) activeCount++;
    }
    while (activeCount < 4) {
      spawnWheat(groundY);
      activeCount++;
    }
    if (sd.fedCount >= sd.cowTarget) { stageScores[stage] = Math.max(20, stageScores[stage]); finishStage(); }
  }

  function spawnWheat(groundY) {
    sd.wheats.push({
      x: W * 0.1 + Math.random() * W * 0.6,
      y: groundY - 20 - Math.random() * 14,
      active: true
    });
  }

  // Stage 1: Milking - click udder
  function updateStage1(dt) {
    // Drag full bucket to facility
    if (sd.bucketDragging) {
      sd.bucketDragX = clickX - sd.dragOffX;
      sd.bucketDragY = clickY - sd.dragOffY;
      var dfx = sd.bucketDragX - sd.facilityX, dfy = sd.bucketDragY - sd.facilityY;
      if (Math.sqrt(dfx*dfx + dfy*dfy) < 60) {
        stageScores[stage] = Math.max(10, stageScores[stage] + 20);
        finishStage();
      }
    }
    if (!mouseDown && !touchActive) sd.bucketDragging = false;
  }

  function tryMilk(mx, my) {
    // If holding bucket to drag
    if (sd.bucketDragging) return;
    if (sd.allDone) {
      var dx2 = mx - sd.bucketDragX, dy2 = my - sd.bucketDragY;
      if (Math.sqrt(dx2*dx2 + dy2*dy2) < 50) {
        sd.bucketDragging = true;
        sd.dragOffX = mx - sd.bucketDragX;
        sd.dragOffY = my - sd.bucketDragY;
      }
      return;
    }
    // Check each cow
    for (var ci = 0; ci < sd.milkCows.length; ci++) {
      var cow = sd.milkCows[ci];
      if (cow.done) continue;
      var dx = mx - cow.udderCX, dy = my - cow.udderCY;
      if (Math.sqrt(dx*dx + dy*dy) < 50) {
        cow.milkAmount += 15 + Math.floor(Math.random() * 7);
        stageScores[stage] += 2;
        sd.milkStreams.push({ life: 0.5, x: cow.udderCX, y: cow.udderCY, bucketX: cow.bucketX, bucketY: cow.bucketY });
        if (cow.milkAmount >= sd.milkTarget) {
          cow.done = true;
          stageScores[stage] += 10;
        }
        // Check if all done
        sd.allDone = true;
        for (var cj = 0; cj < sd.milkCows.length; cj++) {
          if (!sd.milkCows[cj].done) { sd.allDone = false; break; }
        }
        if (sd.allDone) {
          sd.bucketDragX = cow.bucketX;
          sd.bucketDragY = cow.bucketY;
        }
        return;
      }
    }
  }

  // Stage 2: Ice Catcher - cool the milk
  function updateStage2(dt) {
    // Move bucket to mouse/touch
    sd.bucketX = clickX;
    if (sd.bucketX < 30) sd.bucketX = 30;
    if (sd.bucketX > W - 30) sd.bucketX = W - 30;

    // Temp rises naturally
    sd.temp += dt * 1.2;
    sd.tempTime += dt;

    // Spawn ice/heat blocks
    sd.iceSpawnTimer += dt;
    if (sd.iceSpawnTimer > 0.55) {
      sd.iceSpawnTimer = 0;
      var isHeat = Math.random() < 0.2;
      sd.iceBlocks.push({
        x: 40 + Math.random() * (W - 80),
        y: -20,
        r: 14 + Math.random() * 10,
        vy: 160 + Math.random() * 100,
        type: isHeat ? 'heat' : 'ice',
        rot: Math.random() * Math.PI * 2,
        sparkle: Math.random() * Math.PI * 2
      });
    }

    // Update blocks
    for (var i = sd.iceBlocks.length - 1; i >= 0; i--) {
      var b = sd.iceBlocks[i];
      b.y += b.vy * dt;
      b.rot += dt * 3;
      b.sparkle += dt * 5;
      if (b.y > H + 40) { sd.iceBlocks.splice(i, 1); continue; }

      // Collision with bucket
      var dx = Math.abs(b.x - sd.bucketX);
      var dy = b.y - (H * 0.78 - 10);
      if (dx < 38 && dy > -20 && dy < 15) {
        if (b.type === 'ice') {
          sd.temp = Math.max(0.5, sd.temp - 1.2);
          stageScores[stage] += 3;
          // Splash particles
          for (var j = 0; j < 6; j++) {
            sd.iceParticles.push({ x: b.x, y: H*0.78-10, vx: (Math.random()-0.5)*80, vy: -40-Math.random()*60, life: 0.5, color: '#a8e6ff' });
          }
        } else {
          sd.temp += 1.8;
          stageScores[stage] = Math.max(0, stageScores[stage] - 1);
          for (var j = 0; j < 6; j++) {
            sd.iceParticles.push({ x: b.x, y: H*0.78-10, vx: (Math.random()-0.5)*80, vy: -40-Math.random()*60, life: 0.5, color: '#ff8866' });
          }
        }
        sd.iceBlocks.splice(i, 1);
      }
    }

    // Update particles
    for (var i = sd.iceParticles.length - 1; i >= 0; i--) {
      var p = sd.iceParticles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 120 * dt;
      p.life -= dt;
      if (p.life <= 0) sd.iceParticles.splice(i, 1);
    }

    sd.temp = Math.max(0.2, Math.min(9.8, sd.temp));
    if (sd.temp > 7 || sd.temp < 1) { stageScores[stage] = Math.max(0, stageScores[stage] - Math.floor(dt * 8)); }
    if (sd.tempTime >= sd.tempTarget) { stageScores[stage] += Math.floor((1 - Math.abs(sd.temp - 4) / 4) * 50); finishStage(); }
  }

  // Stage 3: Bacteria Pop - pasteurization
  function updateStage3(dt) {
    sd.pasteurTime += dt;
    // Natural cooling
    sd.pasteurTemp -= dt * 1.5;
    if (sd.pasteurTemp < 20) sd.pasteurTemp = 20;

    // Spawn bacteria from edges
    sd.bactSpawnTimer += dt;
    if (sd.bactSpawnTimer > 0.65) {
      sd.bactSpawnTimer = 0;
      var angle = Math.random() * Math.PI * 2;
      var spawnR = sd.tankR + 20;
      sd.bacteria.push({
        x: sd.tankCX + Math.cos(angle) * spawnR,
        y: sd.tankCY + Math.sin(angle) * spawnR,
        r: 8 + Math.random() * 6,
        speed: 30 + Math.random() * 45,
        alive: true
      });
    }

    // Move bacteria toward center
    for (var i = sd.bacteria.length - 1; i >= 0; i--) {
      var b = sd.bacteria[i];
      if (!b.alive) { sd.bacteria.splice(i, 1); continue; }
      var dx = sd.tankCX - b.x, dy = sd.tankCY - b.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 15) {
        // Bacteria reached center - contamination!
        sd.pasteurTime = Math.max(0, sd.pasteurTime - 3);
        stageScores[stage] = Math.max(0, stageScores[stage] - 5);
        sd.bacteria.splice(i, 1);
        // Red flash particles
        for (var j = 0; j < 10; j++) {
          sd.heatRings.push({ x: sd.tankCX, y: sd.tankCY, r: 5, maxR: 40, life: 0.5, color: '#ef4444' });
        }
        continue;
      }
      b.x += (dx / dist) * b.speed * dt;
      b.y += (dy / dist) * b.speed * dt;
    }

    // Process heat rings from clicks
    for (var i = sd.heatRings.length - 1; i >= 0; i--) {
      var hr = sd.heatRings[i];
      hr.r += dt * 100;
      hr.life -= dt;
      if (hr.life <= 0) { sd.heatRings.splice(i, 1); continue; }
      // Kill bacteria in ring
      for (var j = sd.bacteria.length - 1; j >= 0; j--) {
        var b = sd.bacteria[j];
        var dx = b.x - hr.x, dy = b.y - hr.y;
        if (Math.sqrt(dx*dx+dy*dy) < hr.r + b.r) {
          b.alive = false;
          stageScores[stage] += 5;
        }
      }
    }

    sd.pasteurTemp = Math.min(95, sd.pasteurTemp);
    // Temp penalty/bonus
    if (sd.pasteurTemp > 80 || sd.pasteurTemp < 60) {
      stageScores[stage] = Math.max(0, stageScores[stage] - Math.floor(dt * 3));
    } else if (sd.pasteurTemp > 68 && sd.pasteurTemp < 78) {
      stageScores[stage] += Math.floor(dt * 2);
    }

    if (sd.pasteurTime >= sd.pasteurTarget) {
      stageScores[stage] = Math.max(10, stageScores[stage] + Math.floor((1 - Math.abs(sd.pasteurTemp-72)/12) * 40));
      finishStage();
    }
  }

  function handlePasteurClick(mx, my) {
    // Check if click is inside tank
    var dx = mx - sd.tankCX, dy = my - sd.tankCY;
    if (Math.sqrt(dx*dx + dy*dy) < sd.tankR) {
      sd.pasteurTemp += 3;
      sd.heatRings.push({ x: mx, y: my, r: 8, maxR: 70, life: 0.6, color: '#f97316' });
    }
  }

  // Stage 4: Pack & Deliver
  function updateStage4(dt) {
    // Bottle on counter is grabbed - follow cursor
    if (sd.grabbedIdx >= 0) {
      var gb = sd.packBottles[sd.grabbedIdx];
      gb.x += (clickX - gb.x) * 0.25;
      gb.y += (clickY - gb.y) * 0.25;
    }
    // Spawn new bottles on counter
    sd.packSpawnTimer += dt;
    var onCounter = 0;
    for (var i = 0; i < sd.packBottles.length; i++) {
      if (!sd.packBottles[i].packed) onCounter++;
    }
    if (onCounter < 4 && sd.packSpawnTimer > 0.5 && sd.packedCount + onCounter < sd.packTarget) {
      sd.packSpawnTimer = 0;
      var slot = 0;
      var taken = [];
      for (var i = 0; i < sd.packBottles.length; i++) {
        if (!sd.packBottles[i].packed) taken.push(i);
      }
      for (var s = 0; s < 6; s++) {
        var found = false;
        for (var t = 0; t < taken.length; t++) {
          if (sd.packBottles[taken[t]].slotIdx === s) { found = true; break; }
        }
        if (!found) { slot = s; break; }
      }
      sd.packBottles.push({
        x: sd.counterX + slot * 70, y: sd.counterY - 30,
        slotIdx: slot, packed: false, grabbed: false
      });
    }
  }

  function handlePackClick(mx, my) {
    // Check if clicking on the crate to drop
    if (sd.grabbedIdx >= 0) {
      var dx = mx - sd.crateCX, dy = my - sd.crateCY;
      if (Math.abs(dx) < 70 && Math.abs(dy) < 50) {
        // Drop into crate
        var gb = sd.packBottles[sd.grabbedIdx];
        gb.packed = true;
        gb.grabbed = false;
        gb.x = sd.crateCX - 40 + (sd.packedCount % 4) * 28;
        gb.y = sd.crateCY - 15 + Math.floor(sd.packedCount / 4) * 30;
        sd.packedCount++;
        sd.grabbedIdx = -1;
        stageScores[stage] += 8;
        if (sd.packedCount >= sd.packTarget) {
          stageScores[stage] = Math.max(10, stageScores[stage]);
          finishStage();
        }
        return;
      }
    }
    // Check if clicking a bottle on counter to grab
    if (sd.grabbedIdx >= 0) return; // already holding
    for (var i = sd.packBottles.length - 1; i >= 0; i--) {
      var b = sd.packBottles[i];
      if (b.packed) continue;
      var dx = mx - b.x, dy = my - b.y;
      if (Math.abs(dx) < 24 && Math.abs(dy) < 36) {
        b.grabbed = true;
        sd.grabbedIdx = i;
        return;
      }
    }
  }

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  // ─── Stage Draw Functions ───

  function drawStage0() {
    var groundY = H * 0.78;
    // Sky
    var grad = ctx.createLinearGradient(0, 0, 0, groundY);
    grad.addColorStop(0, '#87CEEB'); grad.addColorStop(0.7, '#c8e6c9'); grad.addColorStop(1, '#a5d6a7');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, groundY);
    // Ground
    ctx.fillStyle = '#5a9e3a'; ctx.fillRect(0, groundY, W, H - groundY);
    // Dirt path near cows
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(0, groundY - 6, W, 20);

    // Fence
    ctx.strokeStyle = '#6d4c00'; ctx.lineWidth = 3; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(0, groundY - 16); ctx.lineTo(W, groundY - 16); ctx.stroke();
    for (var fx = 20; fx < W; fx += 80) {
      ctx.fillStyle = '#8B6914'; ctx.fillRect(fx, groundY - 28, 6, 14);
    }

    // Wheat on ground (all active pieces)
    for (var wi = 0; wi < sd.wheats.length; wi++) {
      var wh = sd.wheats[wi];
      if (!wh.active) continue;
      var wx = wh.x, wy = wh.y;
      // Stems
      for (var s = -8; s <= 8; s += 6) {
        ctx.strokeStyle = '#8B9A2B'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(wx + s + 2, wy + 20);
        ctx.quadraticCurveTo(wx + s, wy, wx + s + 3, wy - 14);
        ctx.stroke();
      }
      // Wheat grains
      for (var g = -3; g <= 3; g += 3) {
        ctx.fillStyle = '#D4A830';
        ctx.beginPath(); ctx.ellipse(wx + g + 8, wy - 10, 4, 7, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(wx + g + 12, wy - 8, 4, 7, -0.3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#E8C840';
      ctx.beginPath(); ctx.ellipse(wx + 2, wy - 12, 5, 9, 0, 0, Math.PI * 2); ctx.fill();
      // Glow
      ctx.fillStyle = 'rgba(255,255,200,0.25)';
      ctx.beginPath(); ctx.arc(wx + 2, wy - 2, 20, 0, Math.PI * 2); ctx.fill();
      // Grab highlight
      if (wh === sd.grabbedWheat) {
        ctx.strokeStyle = G; ctx.lineWidth = 2; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(wx + 2, wy - 2, 25, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Cows on ground
    for (var i = 0; i < sd.cows.length; i++) {
      var cow = sd.cows[i];
      var cx = cow.x, cy = cow.y + Math.sin(cow.bob) * 2;
      var cw = cow.w, ch = cow.h;
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath(); ctx.ellipse(cx + cw/2, groundY - 2, cw*0.42, 4, 0, 0, Math.PI*2); ctx.fill();

      ctx.save();
      // Clip to cow area for clean spots
      ctx.beginPath(); ctx.ellipse(cx + cw/2, cy + ch*0.45, cw*0.48, ch*0.42, 0, 0, Math.PI*2); ctx.clip();

      // Base body color
      ctx.fillStyle = '#fefef8';
      ctx.fillRect(cx - 10, cy - 20, cw + 20, ch + 40);

      // Holstein spots
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(cx + cw*0.25, cy + ch*0.3, cw*0.18, ch*0.22, 0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + cw*0.6, cy + ch*0.25, cw*0.22, ch*0.18, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + cw*0.4, cy + ch*0.55, cw*0.16, ch*0.2, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + cw*0.75, cy + ch*0.5, cw*0.13, ch*0.16, 0.3, 0, Math.PI*2); ctx.fill();

      ctx.restore();

      // Neck
      ctx.fillStyle = '#fefef8';
      ctx.beginPath(); ctx.moveTo(cx + cw*0.85, cy + ch*0.15); ctx.lineTo(cx + cw + 5, cy + ch*0.05);
      ctx.lineTo(cx + cw + 5, cy + ch*0.35); ctx.lineTo(cx + cw*0.8, cy + ch*0.4);
      ctx.closePath(); ctx.fill();
      // Neck spot
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(cx + cw*0.9, cy + ch*0.22, cw*0.06, ch*0.08, 0, 0, Math.PI*2); ctx.fill();

      // Head
      ctx.fillStyle = '#fefef8';
      ctx.beginPath(); ctx.ellipse(cx + cw + 12, cy + ch*0.18, ch*0.3, ch*0.22, 0.15, 0, Math.PI*2); ctx.fill();
      // Forehead spot
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(cx + cw + 6, cy + ch*0.1, ch*0.12, ch*0.08, 0, 0, Math.PI*2); ctx.fill();
      // Muzzle
      ctx.fillStyle = '#f0d5d0';
      ctx.beginPath(); ctx.ellipse(cx + cw + 24, cy + ch*0.24, ch*0.14, ch*0.11, 0, 0, Math.PI*2); ctx.fill();
      // Nostrils
      ctx.fillStyle = '#c09090';
      ctx.beginPath(); ctx.arc(cx + cw + 21, cy + ch*0.22, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + cw + 27, cy + ch*0.22, 2, 0, Math.PI*2); ctx.fill();
      // Eye
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(cx + cw + 14, cy + ch*0.12, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx + cw + 13, cy + ch*0.11, 1.2, 0, Math.PI*2); ctx.fill();
      // Ear
      ctx.fillStyle = '#fefef8';
      ctx.beginPath(); ctx.ellipse(cx + cw + 4, cy + ch*0.02, 7, 14, 0.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(cx + cw + 4, cy + ch*0.02, 5, 10, 0.5, 0, Math.PI*2); ctx.fill();
      // Horns
      ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx + cw + 8, cy + ch*0.02); ctx.lineTo(cx + cw + 12, cy - ch*0.08); ctx.stroke();

      // Front leg
      ctx.fillStyle = '#fafaf5';
      ctx.beginPath(); ctx.moveTo(cx + cw*0.72, cy + ch*0.7); ctx.lineTo(cx + cw*0.78, cy + ch*0.7);
      ctx.lineTo(cx + cw*0.76, groundY); ctx.lineTo(cx + cw*0.7, groundY);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(cx + cw*0.7, groundY - 4, cw*0.07, 4);

      // Back leg
      ctx.fillStyle = '#fafaf5';
      ctx.beginPath(); ctx.moveTo(cx + cw*0.18, cy + ch*0.7); ctx.lineTo(cx + cw*0.26, cy + ch*0.7);
      ctx.lineTo(cx + cw*0.24, groundY); ctx.lineTo(cx + cw*0.16, groundY);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(cx + cw*0.16, groundY - 4, cw*0.07, 4);

      // Udder
      ctx.fillStyle = '#f5d0d8';
      ctx.beginPath(); ctx.ellipse(cx + cw*0.48, cy + ch*0.72, ch*0.2, ch*0.15, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e8b8c0';
      ctx.beginPath(); ctx.ellipse(cx + cw*0.48, cy + ch*0.7, ch*0.13, ch*0.09, 0, 0, Math.PI*2); ctx.fill();

      // Tail
      ctx.strokeStyle = '#fefef8'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx + 2, cy + ch*0.35);
      ctx.quadraticCurveTo(cx - 10, cy + ch*0.2, cx - 8, cy + ch*0.55);
      ctx.stroke();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(cx - 8, cy + ch*0.55, 3, 6, 0, 0, Math.PI*2); ctx.fill();

      // Feed progress
      for (var j = 0; j < cow.need; j++) {
        ctx.fillStyle = j < cow.feed ? '#4ade80' : 'rgba(255,255,255,0.3)';
        ctx.fillRect(cx + j*12 + cw*0.15, cy - 10, 8, 5);
      }
      // Ready heart
      if (cow.feed >= cow.need) {
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 16px "Segoe UI",system-ui,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('v', cx + cw/2, cy - 14);
      }
      if (cow.happy > 0) {
        ctx.fillStyle = 'rgba(255,255,0,'+cow.happy+')';
        ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
        ctx.fillText('^', cx + cw/2, cy - 4);
      }
    }

    drawHUD('Drag wheat to feed cows! (' + sd.fedCount + '/' + sd.cowTarget + ')');
  }

  function drawStage1() {
    var groundY = H * 0.78;
    // Nature background
    var grad = ctx.createLinearGradient(0, 0, 0, groundY);
    grad.addColorStop(0, '#7ec8e3'); grad.addColorStop(0.6, '#a8d8a0'); grad.addColorStop(1, '#7cb342');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, groundY);
    ctx.fillStyle = '#558b2f'; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(0, groundY - 4, W, 14);
    // Fence
    ctx.strokeStyle = '#6d4c00'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, groundY - 14); ctx.lineTo(W, groundY - 14); ctx.stroke();
    for (var fx = 30; fx < W; fx += 90) {
      ctx.fillStyle = '#8B6914'; ctx.fillRect(fx, groundY - 24, 5, 12);
    }
    // Sun + clouds
    var sunX = W * 0.8, sunY = H * 0.12;
    var sg = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 80);
    sg.addColorStop(0, 'rgba(255,250,220,0.7)'); sg.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = sg; ctx.fillRect(sunX - 90, sunY - 90, 180, 180);
    ctx.fillStyle = '#fff8dc';
    ctx.beginPath(); ctx.arc(sunX, sunY, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    for (var ci = 0; ci < 4; ci++) {
      var clx = (ci * 280 + Date.now()/40) % (W + 200) - 100;
      ctx.beginPath(); ctx.arc(clx, H*0.1 + ci*20, 24, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(clx+28, H*0.08 + ci*20, 20, 0, Math.PI*2); ctx.fill();
    }

    // Draw each cow
    for (var ci = 0; ci < sd.milkCows.length; ci++) {
      var cow = sd.milkCows[ci];
      var cw = cow.w, ch = cow.h;
      var ccx = cow.x, ccy = cow.y + Math.sin(cow.bob + Date.now()/1000) * 2;
      cow.bob += 0.03;

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath(); ctx.ellipse(ccx + cw/2, groundY - 2, cw*0.42, 4, 0, 0, Math.PI*2); ctx.fill();

      // Body
      ctx.fillStyle = '#fefef8';
      ctx.beginPath(); ctx.ellipse(ccx + cw/2, ccy + ch*0.4, cw*0.48, ch*0.38, 0, 0, Math.PI*2); ctx.fill();
      // Spots
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.ellipse(ccx + cw*0.3, ccy + ch*0.3, cw*0.14, ch*0.16, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(ccx + cw*0.65, ccy + ch*0.35, cw*0.16, ch*0.14, -0.2, 0, Math.PI*2); ctx.fill();

      // Head
      ctx.fillStyle = '#fefef8';
      ctx.beginPath(); ctx.ellipse(ccx + cw + 6, ccy + ch*0.15, ch*0.28, ch*0.2, 0.1, 0, Math.PI*2); ctx.fill();
      // Muzzle
      ctx.fillStyle = '#f0d5d0';
      ctx.beginPath(); ctx.ellipse(ccx + cw + 14, ccy + ch*0.2, ch*0.12, ch*0.09, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#c09090';
      ctx.beginPath(); ctx.arc(ccx + cw + 12, ccy + ch*0.18, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ccx + cw + 16, ccy + ch*0.18, 1.5, 0, Math.PI*2); ctx.fill();
      // Eye
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(ccx + cw + 8, ccy + ch*0.1, 2.5, 0, Math.PI*2); ctx.fill();

      // Legs
      ctx.fillStyle = '#fafaf5';
      ctx.fillRect(ccx + cw*0.18, ccy + ch*0.65, 8, groundY - (ccy + ch*0.65));
      ctx.fillRect(ccx + cw*0.68, ccy + ch*0.65, 8, groundY - (ccy + ch*0.65));
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(ccx + cw*0.18, groundY - 3, 8, 3);
      ctx.fillRect(ccx + cw*0.68, groundY - 3, 8, 3);

      // Udder
      ctx.fillStyle = '#f5d0d8';
      ctx.beginPath(); ctx.ellipse(cow.udderCX, cow.udderCY, 14, 9, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e8b8c0';
      ctx.beginPath(); ctx.ellipse(cow.udderCX, cow.udderCY - 2, 9, 6, 0, 0, Math.PI*2); ctx.fill();
      // Teats
      for (var ti = -6; ti <= 6; ti += 6) {
        ctx.fillStyle = '#f8d8e0';
        ctx.beginPath(); ctx.ellipse(cow.udderCX + ti, cow.udderCY + 10, 4, 6, 0, 0, Math.PI*2); ctx.fill();
      }
      // Glow if not done
      if (!cow.done) {
        var pulse = 0.3 + Math.sin(Date.now()/400) * 0.15;
        ctx.strokeStyle = 'rgba(255,255,255,' + pulse + ')';
        ctx.lineWidth = 2; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(cow.udderCX, cow.udderCY, 28, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
        if (Math.sin(Date.now()/500) > 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.6)';
          ctx.font = 'bold 14px "Segoe UI",system-ui,sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('+', cow.udderCX, cow.udderCY - 14);
        }
      }

      // Bucket on grass
      var bbx = cow.bucketX - 22, bby = cow.bucketY, bbw = 44, bbh = 28;
      ctx.fillStyle = '#aaa';
      ctx.beginPath(); ctx.moveTo(bbx, bby); ctx.lineTo(bbx + bbw, bby);
      ctx.lineTo(bbx + bbw - 4, bby + bbh); ctx.lineTo(bbx + 4, bby + bbh);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#777'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(bbx, bby); ctx.lineTo(bbx + bbw, bby);
      ctx.lineTo(bbx + bbw - 4, bby + bbh); ctx.lineTo(bbx + 4, bby + bbh);
      ctx.closePath(); ctx.stroke();
      // Handle
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cow.bucketX, bby - 3, bbw*0.3, Math.PI, 0); ctx.stroke();
      // Milk fill
      var fillPct = cow.milkAmount / sd.milkTarget;
      if (fillPct > 0) {
        ctx.fillStyle = 'rgba(255,255,250,0.85)';
        ctx.fillRect(bbx + 3, bby + bbh - 4 - (bbh-10)*fillPct, bbw - 6, (bbh-10)*fillPct);
      }
      // Done checkmark
      if (cow.done) {
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 16px "Segoe UI",system-ui,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('OK', cow.bucketX, bby + bbh/2 + 5);
      }
    }

    // Milk streams
    for (var si = sd.milkStreams.length - 1; si >= 0; si--) {
      var ms = sd.milkStreams[si];
      ms.life -= 0.02;
      if (ms.life <= 0) { sd.milkStreams.splice(si, 1); continue; }
      ctx.strokeStyle = 'rgba(255,255,250,' + (ms.life*2) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ms.x, ms.y + 6);
      ctx.lineTo(ms.bucketX, ms.bucketY + 2);
      ctx.stroke();
    }

    // When all done, show facility
    if (sd.allDone) {
      drawMilkFacility();
      drawDraggableBucket2();
    }

    // Instructions
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.min(17, W*0.024) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    var doneCount = 0;
    for (var ci = 0; ci < sd.milkCows.length; ci++) { if (sd.milkCows[ci].done) doneCount++; }
    if (sd.allDone) {
      ctx.fillText('All cows milked! DRAG bucket to facility -->', W/2, H*0.12);
    } else {
      ctx.fillText('Click each cow to milk! Done: ' + doneCount + '/3', W/2, H*0.12);
    }

    drawHUD(sd.allDone ? 'DRAG bucket to facility!' : 'Click cow udders to milk! ' + doneCount + '/3 done');
  }

  function drawDraggableBucket2() {
    var ddx = sd.bucketDragX - 22, ddy = sd.bucketDragY;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(sd.bucketDragX, ddy + 20, 22, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#aaa';
    ctx.beginPath(); ctx.moveTo(ddx, ddy); ctx.lineTo(ddx + 44, ddy);
    ctx.lineTo(ddx + 40, ddy + 28); ctx.lineTo(ddx + 4, ddy + 28);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = G; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ddx, ddy); ctx.lineTo(ddx + 44, ddy);
    ctx.lineTo(ddx + 40, ddy + 28); ctx.lineTo(ddx + 4, ddy + 28);
    ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sd.bucketDragX, ddy - 3, 14, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,250,0.9)';
    ctx.fillRect(ddx + 3, ddy + 4, 38, 20);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('100%', sd.bucketDragX, ddy + 18);
    if (!sd.bucketDragging && Math.sin(Date.now()/500) > 0) {
      ctx.fillStyle = G;
      ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
      ctx.fillText('DRAG ME', sd.bucketDragX, ddy - 8);
    }
  }

  function drawMilkFacility() {
    var fx = sd.facilityX, fy = sd.facilityY;
    // Building
    ctx.fillStyle = '#7eb8da';
    ctx.fillRect(fx - 40, fy - 50, 80, 90);
    ctx.fillStyle = '#5a9ab5';
    ctx.fillRect(fx - 36, fy - 46, 72, 86);
    // Roof
    ctx.fillStyle = '#4a7a95';
    ctx.beginPath(); ctx.moveTo(fx - 48, fy - 50); ctx.lineTo(fx, fy - 70); ctx.lineTo(fx + 48, fy - 50); ctx.closePath(); ctx.fill();
    // Door
    ctx.fillStyle = '#3a5a6a';
    ctx.fillRect(fx - 12, fy + 10, 24, 30);
    // Sign
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('MILK', fx, fy - 20);
    ctx.fillText('FACILITY', fx, fy - 8);
    // Glow when dragging
    if (sd.bucketDragging) {
      var ga = 0.3 + Math.sin(Date.now()/300) * 0.15;
      ctx.strokeStyle = 'rgba(242,194,0,' + ga + ')';
      ctx.lineWidth = 3; ctx.setLineDash([5, 4]);
      ctx.strokeRect(fx - 44, fy - 54, 88, 98);
      ctx.setLineDash([]);
    }
  }

  function drawDraggableBucket(bx, by, bw, bh) {
    var ddx = sd.bucketDragX - bw/2, ddy = sd.bucketDragY - bh/2;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(sd.bucketDragX, sd.bucketDragY + bh/2 + 2, bw*0.5, 5, 0, 0, Math.PI*2); ctx.fill();
    // Bucket
    ctx.fillStyle = '#aaa';
    ctx.beginPath(); ctx.moveTo(ddx, ddy); ctx.lineTo(ddx + bw, ddy);
    ctx.lineTo(ddx + bw - 6, ddy + bh); ctx.lineTo(ddx + 6, ddy + bh);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = G; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ddx, ddy); ctx.lineTo(ddx + bw, ddy);
    ctx.lineTo(ddx + bw - 6, ddy + bh); ctx.lineTo(ddx + 6, ddy + bh);
    ctx.closePath(); ctx.stroke();
    // Handle
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sd.bucketDragX, ddy - 4, bw*0.32, Math.PI, 0); ctx.stroke();
    // Full milk
    ctx.fillStyle = 'rgba(255,255,250,0.95)';
    ctx.fillRect(ddx + 5, ddy + 6, bw - 10, bh - 12);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('100%', sd.bucketDragX, ddy + bh/2 + 4);
    // Grab hint
    if (!sd.bucketDragging && Math.sin(Date.now()/500) > 0) {
      ctx.fillStyle = G;
      ctx.font = 'bold 13px "Segoe UI",system-ui,sans-serif';
      ctx.fillText('DRAG ME', sd.bucketDragX, ddy - 12);
    }
  }

  function drawStage2() {
    var groundY = H * 0.78;
    // Cold room background
    var grad = ctx.createLinearGradient(0, 0, 0, groundY);
    grad.addColorStop(0, '#1a2a4a'); grad.addColorStop(0.5, '#1e3a5f'); grad.addColorStop(1, '#263d6b');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, groundY);
    ctx.fillStyle = '#1a2a3a'; ctx.fillRect(0, groundY, W, H - groundY);

    // Frost at edges
    for (var fi = 0; fi < 8; fi++) {
      ctx.fillStyle = 'rgba(180,220,255,' + (0.06 + Math.sin(Date.now()/2000 + fi)*0.03) + ')';
      ctx.fillRect(0, fi * H/8, 12, H/8 + 4);
      ctx.fillRect(W - 12, fi * H/8, 12, H/8 + 4);
    }

    // Snowflakes drifting
    for (var si = 0; si < 30; si++) {
      var sfX = (si * 137 + Date.now()*0.02) % W;
      var sfY = (si * 89 + Date.now()*0.03) % H;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.2 + 0.3*Math.sin(si+Date.now()/1000)) + ')';
      ctx.beginPath(); ctx.arc(sfX, sfY, 1.5, 0, Math.PI*2); ctx.fill();
    }

    // ─── Milk tank (right side) ───
    var tx = W * 0.82, ty = H * 0.15, tw = 90, th = 260;
    // Tank body
    ctx.fillStyle = '#2a3a5a';
    rrect(tx, ty, tw, th, 12); ctx.fill();
    ctx.strokeStyle = '#4a6a9a'; ctx.lineWidth = 2;
    rrect(tx, ty, tw, th, 12); ctx.stroke();
    // Tank label
    ctx.fillStyle = '#6a8aba';
    ctx.font = 'bold 10px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('MILK', tx + tw/2, ty + 18);
    // Milk fill
    var milkH = th * 0.65;
    ctx.fillStyle = 'rgba(255,255,250,0.8)';
    ctx.fillRect(tx + 4, ty + th - 8 - milkH, tw - 8, milkH);
    // Steam when hot
    if (sd.temp > 5) {
      var steamA = (sd.temp - 5) * 0.15;
      ctx.strokeStyle = 'rgba(255,200,200,' + steamA + ')';
      ctx.lineWidth = 2; ctx.setLineDash([4, 6]);
      for (var st = 0; st < 3; st++) {
        ctx.beginPath();
        ctx.moveTo(tx + 15 + st*30, ty + th - milkH - 10);
        ctx.quadraticCurveTo(tx + 30, ty + th - milkH - 25 - Math.sin(Date.now()/400+st)*8, tx + 15 + st*30 + 10, ty + th - milkH - 35);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    // Temp gauge bar
    var gx = tx + tw + 14, gy = ty, gw = 14, gh = th;
    ctx.fillStyle = '#1a2a3a'; rrect(gx, gy, gw, gh, 7); ctx.fill();
    // Safe zone (green)
    ctx.fillStyle = 'rgba(34,197,94,0.3)';
    ctx.fillRect(gx+2, gy+gh*0.3, gw-4, gh*0.35);
    // Temp indicator
    var tY = gy + gh - (sd.temp/10)*gh;
    var tColor = sd.temp > 6 || sd.temp < 2 ? '#ef4444' : sd.temp > 5 || sd.temp < 3 ? '#f59e0b' : '#22c55e';
    ctx.fillStyle = tColor;
    ctx.fillRect(gx - 4, tY - 2, gw + 8, 5);

    // Temp label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(sd.temp.toFixed(1) + 'C', gx + gw + 6, tY + 4);
    ctx.fillStyle = '#aaa';
    ctx.font = '10px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('4C', gx - 6, gy + gh*0.475 + 4);

    // ─── Timer bar ───
    var timePct = sd.tempTime / sd.tempTarget;
    var tbx = W * 0.1, tby = H * 0.05, tbw = W * 0.65, tbh = 8;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    rrect(tbx, tby, tbw, tbh, 4); ctx.fill();
    ctx.fillStyle = '#38bdf8';
    rrect(tbx, tby, tbw * timePct, tbh, 4); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('COOLING: ' + (sd.tempTarget - sd.tempTime).toFixed(1) + 's', tbx, tby + 20);

    // ─── Falling ice/heat blocks ───
    for (var i = 0; i < sd.iceBlocks.length; i++) {
      var b = sd.iceBlocks[i];
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);

      if (b.type === 'ice') {
        // Ice crystal
        var sz = b.r;
        ctx.fillStyle = 'rgba(180,230,255,0.85)';
        ctx.beginPath();
        for (var pt = 0; pt < 6; pt++) {
          var ang = pt * Math.PI/3 - Math.PI/2;
          var rx = Math.cos(ang) * sz, ry = Math.sin(ang) * sz;
          if (pt === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
          var mx = Math.cos(ang + Math.PI/6) * sz * 0.5;
          var my = Math.sin(ang + Math.PI/6) * sz * 0.5;
          ctx.lineTo(mx, my);
        }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(200,240,255,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
        // Sparkle
        var sparkA = 0.5 + Math.sin(b.sparkle) * 0.3;
        ctx.fillStyle = 'rgba(255,255,255,' + sparkA + ')';
        ctx.beginPath(); ctx.arc(0, -sz*0.1, sz*0.18, 0, Math.PI*2); ctx.fill();
      } else {
        // Heat block
        var sz = b.r;
        ctx.fillStyle = 'rgba(255,100,50,0.8)';
        ctx.beginPath(); ctx.arc(0, 0, sz*0.7, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,150,50,0.6)';
        ctx.beginPath(); ctx.arc(0, 0, sz*0.9, 0, Math.PI*2); ctx.fill();
        // Flame tips
        ctx.fillStyle = 'rgba(255,200,50,0.5)';
        for (var fl = 0; fl < 4; fl++) {
          var fa = fl * Math.PI/2 + b.rot;
          ctx.beginPath(); ctx.arc(Math.cos(fa)*sz*0.5, Math.sin(fa)*sz*0.5, sz*0.3, 0, Math.PI*2); ctx.fill();
        }
        // Warning glow
        var warmA = 0.3 + Math.sin(b.sparkle*2) * 0.2;
        ctx.strokeStyle = 'rgba(255,80,30,' + warmA + ')';
        ctx.lineWidth = 2; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(0, 0, sz*1.1, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
    }

    // ─── Player bucket ───
    var bx = sd.bucketX, by = groundY - 10;
    // Bucket body
    ctx.fillStyle = '#8899aa';
    ctx.beginPath(); ctx.moveTo(bx-28, by-14); ctx.lineTo(bx+28, by-14);
    ctx.lineTo(bx+20, by+14); ctx.lineTo(bx-20, by+14);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#aabbcc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx-28, by-14); ctx.lineTo(bx+28, by-14);
    ctx.lineTo(bx+20, by+14); ctx.lineTo(bx-20, by+14);
    ctx.closePath(); ctx.stroke();
    // Handle
    ctx.strokeStyle = '#99aabb'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bx, by-18, 16, Math.PI, 0); ctx.stroke();
    // Catch zone glow
    ctx.strokeStyle = 'rgba(56,189,248,0.3)';
    ctx.lineWidth = 2; ctx.setLineDash([3, 5]);
    ctx.beginPath(); ctx.arc(bx, by, 40, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);

    // ─── Splash particles ───
    for (var i = 0; i < sd.iceParticles.length; i++) {
      var p = sd.iceParticles[i];
      var alpha = p.life * 2;
      ctx.fillStyle = p.color.replace(')', ',' + alpha + ')').replace('rgb', 'rgba');
      if (p.color.startsWith('#')) {
        ctx.fillStyle = 'rgba(168,230,255,' + alpha + ')';
      }
      ctx.beginPath(); ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI*2); ctx.fill();
    }

    drawHUD('Move mouse to catch ICE blocks! Avoid red HEAT blocks!');
  }

  function drawStage3() {
    // Industrial pasteurization room
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a1008'); grad.addColorStop(0.5, '#2a1a0e'); grad.addColorStop(1, '#150a04');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    // ─── Header panel ───
    var hdrY = 8, hdrH = 52;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    rrect(10, hdrY, W - 20, hdrH, 10); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.min(16, W*0.022) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PASTEURIZATION: Click inside the tank to ZAP bacteria with heat!', W/2, hdrY + 22);
    ctx.fillStyle = '#f97316';
    ctx.font = 'bold ' + Math.min(13, W*0.018) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('Target temperature: 72C  |  Each click heats the milk', W/2, hdrY + 40);

    // ─── Temperature display (big, left side) ───
    var tempX = W * 0.04, tempY = H * 0.2;
    // Background card
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    rrect(tempX, tempY, W * 0.12, H * 0.22, 12); ctx.fill();
    // Temp label
    ctx.fillStyle = '#999';
    ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('TEMP', tempX + W*0.06, tempY + 20);
    // Big temp number
    var tCol = sd.pasteurTemp > 80 || sd.pasteurTemp < 60 ? '#ef4444' :
               sd.pasteurTemp > 68 && sd.pasteurTemp < 78 ? '#22c55e' : '#f59e0b';
    ctx.fillStyle = tCol;
    ctx.font = 'bold ' + Math.min(48, W*0.06) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(sd.pasteurTemp.toFixed(0) + 'C', tempX + W*0.06, tempY + 62);
    // Target
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('Target: 72C', tempX + W*0.06, tempY + 82);
    // Status badge
    var statusText = sd.pasteurTemp > 80 ? 'TOO HOT!' : sd.pasteurTemp < 60 ? 'TOO COLD!' :
                     sd.pasteurTemp > 68 && sd.pasteurTemp < 78 ? 'PERFECT' : 'ADJUST';
    var statusCol = statusText === 'PERFECT' ? '#22c55e' : statusText === 'ADJUST' ? '#f59e0b' : '#ef4444';
    ctx.fillStyle = statusCol;
    ctx.font = 'bold 13px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(statusText, tempX + W*0.06, tempY + 104);

    // ─── Milk tank ───
    var tcx = sd.tankCX, tcy = sd.tankCY, tr = sd.tankR;
    // Outer steel ring
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath(); ctx.arc(tcx, tcy, tr + 10, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(tcx, tcy, tr + 10, 0, Math.PI*2); ctx.stroke();
    // Inner rim
    ctx.strokeStyle = '#777'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(tcx, tcy, tr, 0, Math.PI*2); ctx.stroke();
    // Milk fill
    var milkAlpha = 0.65 + (sd.pasteurTemp / 100) * 0.35;
    ctx.fillStyle = 'rgba(255,255,252,' + milkAlpha + ')';
    ctx.beginPath(); ctx.arc(tcx, tcy, tr - 2, 0, Math.PI*2); ctx.fill();
    // Tank label
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.font = 'bold 14px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('MILK', tcx, tcy + 6);

    // ─── Heat rings ───
    for (var i = 0; i < sd.heatRings.length; i++) {
      var hr = sd.heatRings[i];
      var alpha = hr.life / 0.6;
      ctx.strokeStyle = 'rgba(249,115,22,' + (alpha*0.7) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(hr.x, hr.y, hr.r, 0, Math.PI*2); ctx.stroke();
      // Inner glow
      ctx.strokeStyle = 'rgba(255,200,100,' + (alpha*0.3) + ')';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(hr.x, hr.y, hr.r * 0.7, 0, Math.PI*2); ctx.stroke();
    }

    // ─── Bacteria ───
    for (var i = 0; i < sd.bacteria.length; i++) {
      var b = sd.bacteria[i];
      if (!b.alive) continue;
      // Glow
      ctx.fillStyle = 'rgba(255,0,0,0.15)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.3, 0, Math.PI*2); ctx.fill();
      // Body
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff6666';
      ctx.beginPath(); ctx.arc(b.x - b.r*0.2, b.y - b.r*0.25, b.r*0.35, 0, Math.PI*2); ctx.fill();
      // Spikes
      ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2;
      for (var j = 0; j < 6; j++) {
        var ang = j * Math.PI/3 + Date.now()/1000;
        ctx.beginPath();
        ctx.moveTo(b.x + Math.cos(ang)*b.r*0.55, b.y + Math.sin(ang)*b.r*0.55);
        ctx.lineTo(b.x + Math.cos(ang)*b.r*1.1, b.y + Math.sin(ang)*b.r*1.1);
        ctx.stroke();
      }
      b.x += (Math.random() - 0.5) * 0.4;
      b.y += (Math.random() - 0.5) * 0.4;
    }

    // ─── Progress bar (bottom) ───
    var tp = sd.pasteurTime / sd.pasteurTarget;
    var pbx = W * 0.1, pby = H * 0.88, pbw = W * 0.8, pbh = 10;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    rrect(pbx - 4, pby - 4, pbw + 8, pbh + 16, 8); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    rrect(pbx, pby, pbw, pbh, 5); ctx.fill();
    ctx.fillStyle = tp > 0.7 ? '#22c55e' : '#f97316';
    rrect(pbx, pby, pbw * tp, pbh, 5); ctx.fill();
    // Progress label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PASTEURIZATION: ' + Math.floor(tp*100) + '% complete', W/2, pby + pbh + 18);

    // ─── Instructions ───
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = 'bold ' + Math.min(14, W*0.02) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CLICK INSIDE THE TANK to kill bacteria  |  Keep temperature at 72C', W/2, H*0.96);

    drawHUD('CLICK tank to ZAP bacteria! Keep at 72C | Score: ' + stageScores[stage]);
  }

  function drawStage4() {
    // Packing room
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#e8e0d8'); grad.addColorStop(0.5, '#d8d0c8'); grad.addColorStop(1, '#c8c0b8');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    // Floor line
    ctx.fillStyle = '#bbb'; ctx.fillRect(0, H*0.72, W, 4);

    // ─── Counter (left) ───
    var ctrX = sd.counterX - 40, ctrY = sd.counterY, ctrW = 420, ctrH = 16;
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(ctrX, ctrY, ctrW, ctrH);
    ctx.fillStyle = '#a08060';
    ctx.fillRect(ctrX, ctrY, ctrW, 4);
    // Counter legs
    ctx.fillStyle = '#6B5335';
    ctx.fillRect(ctrX + 30, ctrY + ctrH, 10, H*0.72 - ctrY - ctrH);
    ctx.fillRect(ctrX + ctrW - 40, ctrY + ctrH, 10, H*0.72 - ctrY - ctrH);
    // Shelf label
    ctx.fillStyle = '#555';
    ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Fresh Milk Bottles', ctrX + 10, ctrY - 8);

    // ─── Milk bottles on counter ───
    for (var i = 0; i < sd.packBottles.length; i++) {
      var b = sd.packBottles[i];
      if (b.packed) continue;
      var bx = b.x, by = b.y;
      // Bottle body
      ctx.fillStyle = 'rgba(255,255,252,0.9)';
      ctx.fillRect(bx - 12, by - 36, 24, 38);
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1.5;
      ctx.strokeRect(bx - 12, by - 36, 24, 38);
      // Neck
      ctx.fillStyle = 'rgba(255,255,252,0.85)';
      ctx.fillRect(bx - 5, by - 46, 10, 12);
      ctx.strokeRect(bx - 5, by - 46, 10, 12);
      // Cap
      ctx.fillStyle = N;
      ctx.fillRect(bx - 6, by - 50, 12, 6);
      // Milk fill
      ctx.fillStyle = 'rgba(255,255,250,0.6)';
      ctx.fillRect(bx - 9, by - 10, 18, 12);
      // Grab highlight
      if (b.grabbed) {
        ctx.strokeStyle = G; ctx.lineWidth = 2;
        ctx.setLineDash([3, 3]);
        ctx.strokeRect(bx - 14, by - 52, 28, 54);
        ctx.setLineDash([]);
      }
    }

    // ─── Crate (right) ───
    var crX = sd.crateCX - 75, crY = sd.crateCY - 35, crW = 150, crH = 80;
    // Crate body
    ctx.fillStyle = '#c49a3c';
    ctx.fillRect(crX, crY, crW, crH);
    ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 3;
    ctx.strokeRect(crX, crY, crW, crH);
    // Slats
    ctx.strokeStyle = '#a07820'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(crX, crY + crH*0.33); ctx.lineTo(crX + crW, crY + crH*0.33); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(crX, crY + crH*0.66); ctx.lineTo(crX + crW, crY + crH*0.66); ctx.stroke();
    // Crate label
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('VITA DAIRY', crX + crW/2, crY - 8);
    // Target glow when holding bottle
    if (sd.grabbedIdx >= 0) {
      var glowA = 0.3 + Math.sin(Date.now()/300) * 0.15;
      ctx.strokeStyle = 'rgba(242,194,0,' + glowA + ')';
      ctx.lineWidth = 3; ctx.setLineDash([5, 4]);
      ctx.strokeRect(crX - 4, crY - 4, crW + 8, crH + 8);
      ctx.setLineDash([]);
    }

    // ─── Packed bottles in crate ───
    for (var i = 0; i < sd.packBottles.length; i++) {
      var b = sd.packBottles[i];
      if (!b.packed) continue;
      var bx = b.x, by = b.y;
      ctx.fillStyle = 'rgba(255,255,252,0.9)';
      ctx.fillRect(bx - 8, by - 24, 16, 26);
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
      ctx.strokeRect(bx - 8, by - 24, 16, 26);
      ctx.fillStyle = N;
      ctx.fillRect(bx - 4, by - 30, 8, 4);
      ctx.fillStyle = 'rgba(255,255,250,0.5)';
      ctx.fillRect(bx - 5, by - 4, 10, 6);
    }

    // ─── Counter ───
    ctx.fillStyle = '#000';
    ctx.font = 'bold ' + Math.min(22, W*0.03) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Packed: ' + sd.packedCount + ' / ' + sd.packTarget, W/2, H*0.82);

    // Instructions
    ctx.fillStyle = '#333';
    ctx.font = 'bold ' + Math.min(15, W*0.022) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    var instr = sd.grabbedIdx >= 0 ? 'Now click the CRATE to drop it in!' : 'Click a bottle to grab it!';
    ctx.fillText(instr, W/2, H*0.12);

    drawHUD('Click bottles then click crate to pack! ' + sd.packedCount + '/' + sd.packTarget);
  }

  function drawHUD(text) {
    // Stage indicator
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    rrect(8, 8, 180, 24, 12); ctx.fill();
    ctx.fillStyle = STAGES[stage].color;
    ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('STAGE ' + (stage+1) + ': ' + STAGES[stage].name, 16, 25);

    // Score
    if (stageScores[stage] > 0) {
      ctx.fillStyle = G;
      ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(stageScores[stage] + ' pts', W - 12, 25);
    }

    // Help text at bottom
    if (text) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      var tw = ctx.measureText(text).width + 40;
      rrect(W/2 - tw/2, H - 34, tw, 24, 12); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '11px "Segoe UI",system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, W/2, H - 18);
    }
  }

  function drawBasePlay() {
    if (stage === 0) drawStage0();
    else if (stage === 1) drawStage1();
    else if (stage === 2) drawStage2();
    else if (stage === 3) drawStage3();
    else if (stage === 4) drawStage4();
  }

  // ─── Main Loop ───
  var lastTime = null;
  function loop(timestamp) {
    if (lastTime === null) lastTime = timestamp;
    var dt = Math.min(0.1, (timestamp - lastTime) / 1000);
    lastTime = timestamp;

    ctx.clearRect(0, 0, W, H);

    if (gs === STATE.MENU) {
      drawMenu();
    } else if (gs === STATE.INTRO) {
      drawStageIntro();
      update(dt);
    } else if (gs === STATE.PLAYING) {
      update(dt);
      drawBasePlay();
    } else if (gs === STATE.STAGE_CLEAR) {
      drawBasePlay();
      drawStageClear();
      if (clearTimer === 0) { clearTimer = 0.001; }
      clearTimer += dt;
    } else if (gs === STATE.FINAL) {
      drawFinal();
    }

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
